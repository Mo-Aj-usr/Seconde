<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>QCM 2 – Fonctions (Seconde +)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
 --bg:#020617;
 --text:#f8fafc;
 --muted:#cbd5f5;
 --border:rgba(148,163,184,.45);
 --accent:#fb923c;
 --success:#4ade80;
 --error:#f87171;
}
*{box-sizing:border-box}
body{
 margin:0;
 font-family:system-ui,sans-serif;
 background:radial-gradient(circle at top,#1f2937,#020617 70%);
 color:var(--text);
 padding:16px;
}
.app{
 max-width:920px;
 margin:auto;
 background:rgba(2,6,23,.97);
 border-radius:18px;
 border:1px solid var(--border);
 padding:18px;
}
.title{font-size:1.5rem;font-weight:700}
.subtitle{color:var(--muted);margin-bottom:14px}
.card{
 border:1px solid var(--border);
 border-radius:16px;
 padding:16px;
}
.q-text{font-size:1.05rem;line-height:1.6;white-space:pre-line}
.answers{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.answer{
 background:rgba(15,23,42,.9);
 border:1px solid var(--border);
 border-radius:12px;
 padding:10px;
 cursor:pointer;
}
.answer:hover{border-color:#f8fafc}
.answer.correct{border-color:var(--success)}
.answer.wrong{border-color:var(--error)}
.feedback{margin-top:8px;font-size:.9rem}
.feedback.ok{color:var(--success)}
.feedback.ko{color:var(--error)}
.nav{display:flex;justify-content:space-between;margin-top:12px}
button{
 padding:8px 16px;
 border-radius:999px;
 border:1px solid var(--border);
 background:rgba(15,23,42,.95);
 color:var(--text);
 cursor:pointer;
}
button:disabled{opacity:.4}
.math-box{
 background:#020617;
 border:1px solid var(--border);
 border-radius:12px;
 padding:10px;
 margin:10px 0;
}
</style>
</head>

<body>
<div class="app">
<div class="title">QCM 2 – Fonctions (niveau exigeant)</div>
<div class="subtitle">
Lecture graphique approfondie – images – antécédents – variations – zéros.
</div>

<div class="card">
  <div class="q-text" id="qText"></div>
  <div class="answers" id="answers"></div>
  <div class="feedback" id="feedback"></div>
  <div class="nav">
    <button id="prev">◀ Précédent</button>
    <button id="next">Suivant ▶</button>
  </div>
</div>
</div>

<script>
/* ===== QUESTIONS ===== */
const questions=[
/* 1 */
{
 text:"On considère la courbe de la fonction f ci-dessous.\nQuelle est l’image de 1 ?",
 graph:{points:[{x:-2,y:-1},{x:0,y:1},{x:1,y:3},{x:3,y:0}]},
 choices:["1","2","3","0"],
 correct:2,
 explanation:"Le point d’abscisse 1 a pour ordonnée 3."
},
/* 2 */
{
 text:"D’après ce graphique, combien f admet-elle d’antécédents de 0 ?",
 graph:{points:[{x:-3,y:1},{x:-1,y:-1},{x:1,y:1},{x:3,y:-1}]},
 choices:["0","1","2","3"],
 correct:2,
 explanation:"La courbe coupe l’axe des abscisses en deux points."
},
/* 3 */
{
 text:"Quel est un antécédent de −1 ?",
 graph:{points:[{x:-2,y:-1},{x:0,y:2},{x:2,y:-1}]},
 choices:["−2","0","1","2"],
 correct:0,
 explanation:"Le point (−2,−1) est sur la courbe."
},
/* 4 */
{
 text:"Quelle est la valeur de f(0) ?",
 graph:{points:[{x:-2,y:0},{x:0,y:-2},{x:2,y:0}]},
 choices:["0","−2","2","1"],
 correct:1,
 explanation:"À x=0, l’ordonnée est −2."
},
/* 5 */
{
 text:"La courbe coupe l’axe des abscisses en :",
 graph:{points:[{x:-3,y:0},{x:-1,y:2},{x:1,y:2},{x:3,y:0}]},
 choices:["−1 et 1","−3 et 3","0","−3,0,3"],
 correct:1,
 explanation:"Les points d’intersection avec l’axe des abscisses sont (−3,0) et (3,0)."
},
/* 6 */
{
 text:"D’après le graphique, f est croissante sur :",
 graph:{points:[{x:-3,y:-2},{x:-1,y:0},{x:1,y:2},{x:3,y:1}]},
 choices:["[−3;−1]","[1;3]","[−1;3]","[−3;3]"],
 correct:0,
 explanation:"La courbe monte de −3 à −1."
},
/* 7 */
{
 text:"Quelle est la plus grande image visible sur ce graphique ?",
 graph:{points:[{x:-2,y:1},{x:0,y:4},{x:2,y:2}]},
 choices:["1","2","3","4"],
 correct:3,
 explanation:"Le maximum visible est 4."
},
/* 8 */
{
 text:"Quelle est la plus petite image de f ?",
 graph:{points:[{x:-3,y:-2},{x:-1,y:1},{x:1,y:-1},{x:3,y:0}]},
 choices:["−2","−1","0","1"],
 correct:0,
 explanation:"La plus petite ordonnée est −2."
},
/* 9 */
{
 text:"Combien d’antécédents admet l’image 1 ?",
 graph:{points:[{x:-3,y:1},{x:-1,y:3},{x:1,y:1},{x:3,y:-1}]},
 choices:["0","1","2","3"],
 correct:2,
 explanation:"Deux points ont pour ordonnée 1."
},
/* 10 */
{
 text:"Quelle affirmation est vraie ?",
 graph:{points:[{x:-2,y:2},{x:0,y:0},{x:2,y:-2}]},
 choices:["f(2)=2","f(0)=2","f(−2)=2","f(−2)=−2"],
 correct:2,
 explanation:"Le point (−2,2) est sur la courbe."
},
/* 11 */
{
 text:"La courbe est symétrique par rapport à :",
 graph:{points:[{x:-2,y:1},{x:0,y:3},{x:2,y:1}]},
 choices:["l’axe des abscisses","l’axe des ordonnées","l’origine","aucune"],
 correct:1,
 explanation:"La courbe est symétrique par rapport à l’axe des ordonnées."
},
/* 12 */
{
 text:"Quel est le nombre de zéros de f ?",
 graph:{points:[{x:-3,y:1},{x:-1,y:-1},{x:1,y:-1},{x:3,y:1}]},
 choices:["0","1","2","3"],
 correct:2,
 explanation:"La courbe coupe l’axe des abscisses deux fois."
},
/* 13 */
{
 text:"Sur quel intervalle f est-elle décroissante ?",
 graph:{points:[{x:-3,y:2},{x:-1,y:1},{x:1,y:-1},{x:3,y:-2}]},
 choices:["[−3;−1]","[−1;1]","[1;3]","[−3;3]"],
 correct:3,
 explanation:"La courbe descend sur tout l’intervalle."
},
/* 14 */
{
 text:"Quelle est l’image de −1 ?",
 graph:{points:[{x:-2,y:0},{x:-1,y:2},{x:1,y:2},{x:2,y:0}]},
 choices:["0","1","2","−2"],
 correct:2,
 explanation:"À x=−1 correspond y=2."
},
/* 15 */
{
 text:"Combien d’antécédents admet l’image 0 ?",
 graph:{points:[{x:-3,y:0},{x:-1,y:2},{x:1,y:2},{x:3,y:0}]},
 choices:["0","1","2","3"],
 correct:2,
 explanation:"Deux antécédents : −3 et 3."
}
];

let index=0;
const qText=document.getElementById("qText");
const answers=document.getElementById("answers");
const feedback=document.getElementById("feedback");

/* ===== REPÈRE ORTHONORMÉ GRADUÉ ===== */
function renderGraph(g){
 const d=document.createElement("div");
 d.className="math-box";
 const scale=30,ox=120,oy=80;
 let ticks="";
 for(let i=-4;i<=4;i++){
  ticks+=`
   <line x1="${ox+i*scale}" y1="${oy-4}" x2="${ox+i*scale}" y2="${oy+4}" stroke="#94a3b8"/>
   <text x="${ox+i*scale-4}" y="${oy+16}" font-size="10" fill="#e5e7eb">${i}</text>
   <line x1="${ox-4}" y1="${oy-i*scale}" x2="${ox+4}" y2="${oy-i*scale}" stroke="#94a3b8"/>
   <text x="${ox+8}" y="${oy-i*scale+4}" font-size="10" fill="#e5e7eb">${i}</text>
  `;
 }
 const pts=g.points.map(p=>
  `<circle cx="${ox+p.x*scale}" cy="${oy-p.y*scale}" r="4" fill="#fb923c"/>`
 ).join("");
 d.innerHTML=`
 <svg width="240" height="160">
  <line x1="0" y1="${oy}" x2="240" y2="${oy}" stroke="#64748b"/>
  <line x1="${ox}" y1="0" x2="${ox}" y2="160" stroke="#64748b"/>
  ${ticks}${pts}
 </svg>`;
 return d;
}

function render(){
 const q=questions[index];
 qText.innerHTML=q.text;
 answers.innerHTML="";
 feedback.textContent="";
 if(q.graph) qText.appendChild(renderGraph(q.graph));

 q.choices.forEach((c,i)=>{
  const b=document.createElement("button");
  b.className="answer";
  b.textContent=c;
  b.onclick=()=>{
   if(i===q.correct){
    b.classList.add("correct");
    feedback.textContent="Bonne réponse. "+q.explanation;
    feedback.className="feedback ok";
   } else {
    b.classList.add("wrong");
    feedback.textContent="Mauvaise réponse. "+q.explanation;
    feedback.className="feedback ko";
   }
  };
  answers.appendChild(b);
 });
}

document.getElementById("prev").onclick=()=>{if(index>0){index--;render();}};
document.getElementById("next").onclick=()=>{if(index<questions.length-1){index++;render();}};
render();
</script>
</body>
</html>
