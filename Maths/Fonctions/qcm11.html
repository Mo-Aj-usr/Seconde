<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QCM Avancé - Fonctions Seconde</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f2f5;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .dashboard {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            font-size: 1.2em;
            font-weight: bold;
            color: #34495e;
        }
        .question {
            font-size: 1.15em;
            margin: 25px 0;
        }
        .graph {
            text-align: center;
            margin: 20px 0;
        }
        .graph img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        .options {
            display: flex;
            flex-direction: column;
        }
        .option {
            margin: 12px 0;
            padding: 12px;
            background: #f9f9f9;
            border-radius: 6px;
            cursor: pointer;
        }
        .option input {
            margin-right: 10px;
        }
        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 6px;
            font-weight: bold;
            display: none;
        }
        .correct { background-color: #d4edda; color: #155724; }
        .incorrect { background-color: #f8d7da; color: #721c24; }
        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }
        button {
            padding: 12px 24px;
            font-size: 1em;
            border: none;
            border-radius: 6px;
            background-color: #3498db;
            color: white;
            cursor: pointer;
        }
        button:hover { background-color: #2980b9; }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        #results { display: none; }
        .result-item {
            margin: 20px 0;
            padding: 15px;
            border-left: 5px solid #3498db;
            background: #f8f9fa;
        }
        @media (max-width: 600px) {
            .buttons { flex-direction: column; }
            button { margin-bottom: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>QCM Avancé : Fonctions - Seconde</h1>
        <div class="dashboard">
            Question <span id="currentQuestion">1</span>/15
        </div>

        <div id="quiz">
            <div class="question" id="questionText"></div>
            <div class="graph" id="graph"></div>
            <div class="options" id="options"></div>
            <div class="feedback" id="feedback"></div>

            <div class="buttons">
                <button id="prev">Précédent</button>
                <button id="next">Suivant</button>
                <button id="finish">Terminer le test</button>
            </div>
        </div>

        <div id="results">
            <h2>Votre bilan</h2>
            <div id="score"></div>
            <div id="explanations"></div>
        </div>
    </div>

                options: ["Oui", "Non", "Seulement sur [-2, 0]", "Seulement sur [0, 2]"],

                explanation: "La courbe monte puis descend sur [-2, 2] → non croissante sur l’intervalle."
            },
            {

                graph: false,
                options: ["0", "1", "2", "Infini"],
                correct: 2,
                explanation: "Équation x² - 4x + 3 = 0 → (x-1)(x-3)=0 → x=1 ou x=3 → 2 antécédents."
            },
            {
                question: "Dans le tableau :<br>x → 0 1 2 3 4<br>f(x) → -1 1 3 3 1<br>Quelle est la plus grande image atteinte ?",
                graph: false,
                options: ["1", "3", "-1", "4"],
                correct: 1,
                explanation: "Les valeurs sont -1, 1, 3, 3, 1 → maximum = 3."
            },
            {
                question: "Sur ce graphique, quel est le domaine de définition apparent de la fonction ?",
                graph: true,
                graphData: "data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgZmlsbD0iI2Y5ZjlmOSI+PC9yZWN0PjxnPjxsaW5lIHgxPSIyMCIgeTE9IjI4MCIgeDI9IjM4MCIgeTI9IjI4MCIgc3Ryb2tlPSJibGFjayIgc3Ryb2tlLXdpZHRoPSIyIi8+PGxpbmUgeDE9IjIwIiB5MT0iMjgwIiB4Mj0iMjAiIHkyPSIyMCIgc3Ryb2tlPSJibGFjayIgc3Ryb2tlLXdpZHRoPSIyIi8+PHBhdGggZD0iTTE0MCAyODAgTDIwMCAxODAgQ3gyNjAgMTQwIDI4MCAxODAgMzAwIDE0MCIgc3Ryb2tlPSJwdXJwbGUiIGZpbGw9Im5vbmUiIHN0cm9rZS13aWR0aD0iMyIvPjxjaXJjbGUgY3g9IjIyMCIgY3k9IjI4MCIgcj0iNSIgZmlsbD0icmVkIi8+PC9nPjwvc3ZnPg==",
                options: ["[0, +∞[", "]0, +∞[", "ℝ", "]1, +∞["],
                correct: 1,
                explanation: "La courbe commence juste après x=0 (trou ouvert) et va vers +∞."
            },
            {
                question: "La fonction h(x) = 1/(x² - 1) admet une asymptote verticale en :",
                graph: false,
                options: ["x = 0", "x = 1 et x = -1", "x = 1 seulement", "Aucune"],
                correct: 1,
                explanation: "Dénominateur nul pour x² - 1 = 0 ⇒ x = ±1."
            },
            {
                question: "Sur le graphique, combien de solutions a l’équation f(x) = 1 ?",
                graph: true,
                graphData: "data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgZmlsbD0iI2Y5ZjlmOSI+PC9yZWN0PjxnPjxsaW5lIHgxPSIyMCIgeTE9IjI4MCIgeDI9IjM4MCIgeTI9IjI4MCIgc3Ryb2tlPSJibGFjayIgc3Ryb2tlLXdpZHRoPSIyIi8+PGxpbmUgeDE9IjIwIiB5MT0iMjgwIiB4Mj0iMjAiIHkyPSIyMCIgc3Ryb2tlPSJibGFjayIgc3Ryb2tlLXdpZHRoPSIyIi8+PGxpbmUgeDE9IjIwIiB5MT0iMjIwIiB4Mj0iMzgwIiB5Mj0iMjIwIiBzdHJva2U9ImdyYXkiIHN0cm9rZS1kYXNoYXJyYXk9IjUsNSIvPjxwYXRoIGQ9Ik0xMDAgMjYwIEwxNjAgMTAwIEwyMjAgMjAwIE0yODAgMTAwIiBzdHJva2U9Im9yYW5nZSIgZmlsbD0ibm9uZSIgc3Ryb2tlLXdpZHRoPSIzIi8+PGNpcmNsZSBjeD0iMTQwIiBjeT0iMjIwIiByPSI0IiBmaWxsPSJncmVlbiIvPjxjaXJjbGUgY3g9IjI0MCIgY3k9IjIyMCIgcj0iNCIgZmlsbD0iZ3JlZW4iLz48Y2lyY2xlIGN4PSIzMDAiIGN5PSIyMjAiIHI9IjQiIGZpbGw9ImdyZWVuIi8+PC9nPjwvc3ZnPg==",
                options: ["1", "2", "3", "4"],
                correct: 2,
                explanation: "La droite y=1 (en pointillés) coupe la courbe en 3 points → 3 solutions."
            },
            {
                question: "Pour f(x) = √(4 - x) + 1/(x + 3), quel est le domaine de définition ?",
                graph: false,
                options: ["]-∞, 4] \\ {-3}", "[ -3, 4 ]", "] -∞, 4 [ \\ {-3}", "]-3, 4]"],
                correct: 0,
                explanation: "4 - x ≥ 0 ⇒ x ≤ 4 et x ≠ -3 → Df = ]-∞, 4] \\ {-3}."
            },
            {
                question: "Sur le graphique, quelle est approximativement l’image de x = 1 ?",
                graph: true,
                graphData: "data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgZmlsbD0iI2Y5ZjlmOSI+PC9yZWN0PjxnPjxsaW5lIHgxPSIyMCIgeTE9IjI4MCIgeDI9IjM4MCIgeTI9IjI4MCIgc3Ryb2tlPSJibGFjayIgc3Ryb2tlLXdpZHRoPSIyIi8+PGxpbmUgeDE9IjIwIiB5MT0iMjgwIiB4Mj0iMjAiIHkyPSIyMCIgc3Ryb2tlPSJibGFjayIgc3Ryb2tlLXdpZHRoPSIyIi8+PHRleHQgeD0iMjAwIiB5PSIzMDAiPlg8L3RleHQ+PHRleHQgeD0iMjAwIiB5PSIzMDAiPjE8L3RleHQ+PHBhdGggZD0iTTE0MCAyNjAgQzE4MCAxODAgMjIwIDE0MCAyNjAgMjAwIiBzdHJva2U9InB1cnBsZSIgZmlsbD0ibm9uZSIgc3Ryb2tlLXdpZHRoPSIzIi8+PGNpcmNsZSBjeD0iMjAwIiBjeT0iMTYwIiByPSI1IiBmaWxsPSJyZWQiLz48L2c+PC9zdmc+",
                options: ["f(1) ≈ 1,8", "f(1) ≈ 2,4", "f(1) ≈ 1,2", "f(1) = 0"],
                correct: 0,
                explanation: "La verticale x=1 coupe la courbe à y ≈ 1,8."
            },
            {
                question: "Une fonction paire satisfait f(-x) = f(x). Laquelle de ces fonctions est paire ?",
                graph: false,
                options: ["f(x) = x²", "f(x) = x³", "f(x) = 2x + 1", "f(x) = ln(x)"],
                correct: 0,
                explanation: "Seule x² vérifie f(-x) = (-x)² = x² = f(x)."
            }
        ];

        let current = 0;
        let answers = new Array(questions.length).fill(null);
        let feedbacks = new Array(questions.length).fill('');

        function loadQuestion() {
            const q = questions[current];
            document.getElementById('questionText').innerHTML = `<strong>Question ${current + 1} :</strong> ${q.question}`;
            
            const graphDiv = document.getElementById('graph');
            if (q.graph) {
                graphDiv.innerHTML = `<img src="${q.graphData}" alt="Graphique de la fonction">`;
            } else {
                graphDiv.innerHTML = '';
            }

            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            q.options.forEach((opt, i) => {
                const label = document.createElement('label');
                label.className = 'option';
                const input = document.createElement('input');
                input.type = 'radio';
                input.name = 'option';
                input.value = i;
                input.onclick = () => selectOption(i);
                if (answers[current] === i) input.checked = true;
                label.appendChild(input);
                label.appendChild(document.createTextNode(' ' + opt));
                optionsDiv.appendChild(label);
            });

            const feedbackDiv = document.getElementById('feedback');
            if (feedbacks[current]) {
                feedbackDiv.innerHTML = feedbacks[current] + '<br><br><strong>Explication :</strong> ' + q.explanation;
                feedbackDiv.className = 'feedback ' + (answers[current] === q.correct ? 'correct' : 'incorrect');
                feedbackDiv.style.display = 'block';
            } else {
                feedbackDiv.style.display = 'none';
            }

            document.getElementById('currentQuestion').textContent = current + 1;
            document.getElementById('prev').disabled = current === 0;
            document.getElementById('next').disabled = current === questions.length - 1;
        }

        function selectOption(selected) {
            answers[current] = selected;
            const q = questions[current];
            const isCorrect = selected === q.correct;
            feedbacks[current] = isCorrect ? '✓ Bonne réponse !' : `✗ Mauvaise réponse. La bonne est : ${q.options[q.correct]}`;
            loadQuestion();
        }

        document.getElementById('prev').onclick = () => {
            if (current > 0) current--;
            loadQuestion();
        };

        document.getElementById('next').onclick = () => {
            if (current < questions.length - 1) current++;
            loadQuestion();
        };

        document.getElementById('finish').onclick = () => {
            document.getElementById('quiz').style.display = 'none';
            document.getElementById('results').style.display = 'block';

            let score = 0;
            questions.forEach((q, i) => {
                if (answers[i] === q.correct) score++;
            });

            document.getElementById('score').innerHTML = `<h3>Votre score : ${score} / ${questions.length}</h3>`;

            const explDiv = document.getElementById('explanations');
            questions.forEach((q, i) => {
                const div = document.createElement('div');
                div.className = 'result-item';
                div.innerHTML = `
                    <strong>Question ${i+1}</strong><br>
                    ${q.question}<br>
                    ${q.graph ? '<img src="'+q.graphData+'" style="max-width:300px; margin:10px 0;">' : ''}
                    <em>Votre réponse :</em> ${answers[i] !== null ? q.options[answers[i]] : 'Non répondue'}<br>
                    <strong>${answers[i] === q.correct ? '✓ Correct' : '✗ Incorrect'}</strong><br>
                    <strong>Explication :</strong> ${q.explanation}
                `;
                explDiv.appendChild(div);
            });
        };

        loadQuestion();
    </script>
</body>
</html>
