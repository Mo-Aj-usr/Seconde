<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>QCM – Fonctions (Seconde)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --bg: #020617;
  --card: #020617;
  --text: #f8fafc;
  --muted: #cbd5f5;
  --border: rgba(148,163,184,0.45);
  --accent: #fb923c;
  --success: #4ade80;
  --error: #f87171;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: radial-gradient(circle at top, #1f2937, #020617 70%);
  color: var(--text);
  padding: 16px;
}

.app {
  max-width: 900px;
  margin: auto;
  background: rgba(2,6,23,0.97);
  border-radius: 18px;
  border: 1px solid var(--border);
  padding: 18px;
}

.title {
  font-size: 1.4rem;
  font-weight: 700;
}

.subtitle {
  font-size: 0.9rem;
  color: var(--muted);
  margin-bottom: 14px;
}

.card {
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
}

.q-text {
  font-size: 1.05rem;
  line-height: 1.6;
  white-space: pre-line;
}

.hint {
  font-size: 0.85rem;
  color: var(--muted);
  margin-top: 4px;
}

.answers {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.answer {
  background: rgba(15,23,42,0.9);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px;
  cursor: pointer;
  color: var(--text);
  text-align: left;
}

.answer:hover { border-color: #f8fafc; }

.answer.correct { border-color: var(--success); }
.answer.wrong { border-color: var(--error); }

.feedback {
  margin-top: 8px;
  font-size: 0.9rem;
}

.feedback.ok { color: var(--success); }
.feedback.ko { color: var(--error); }

.nav {
  display: flex;
  justify-content: space-between;
  margin-top: 12px;
}

button {
  padding: 8px 16px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: rgba(15,23,42,0.95);
  color: var(--text);
  cursor: pointer;
}

button:disabled {
  opacity: 0.4;
  cursor: default;
}

.math-box {
  background: #020617;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px;
  margin: 10px 0;
}

/* tableaux */
table {
  width: 100%;
  border-collapse: collapse;
  text-align: center;
}

th, td {
  border: 1px solid var(--border);
  padding: 6px;
}
</style>
</head>

<body>
<div class="app">

<div class="title">Fonctions – QCM (2nde)</div>
<div class="subtitle">
Domaine de définition – images – antécédents – lecture de tableaux et de graphiques.
</div>

<div class="card">
  <div class="q-text" id="qText"></div>
  <div class="hint" id="qHint"></div>
  <div class="answers" id="answers"></div>
  <div class="feedback" id="feedback"></div>

  <div class="nav">
    <button id="prev">◀ Précédent</button>
    <button id="next">Suivant ▶</button>
  </div>
</div>

</div>

<script>
const questions = [
/* 1 */
{
 text:"On considère la fonction f définie par f(x)=2x+3.\nQuel est son ensemble de définition ?",
 choices:["ℝ","ℝ⁺","ℝ\\{0}","ℕ"],
 correct:0,
 explanation:"Une fonction polynomiale est définie pour tout réel."
},
/* 2 */
{
 text:"Pour f(x)=5/(x−2), quel est l’ensemble de définition ?",
 choices:["ℝ","ℝ\\{5}","ℝ\\{2}","ℝ⁺"],
 correct:2,
 explanation:"Le dénominateur ne doit pas être nul."
},
/* 3 */
{
 text:"Pour f(x)=√(x−1), quelle condition doit vérifier x ?",
 choices:["x≥1","x>1","x≤1","x∈ℝ"],
 correct:0,
 explanation:"Sous la racine, x−1≥0."
},
/* 4 */
{
 text:"Soit f(x)=−3x+1. Que vaut f(2) ?",
 choices:["−5","−3","−2","7"],
 correct:0,
 explanation:"f(2)=−6+1=−5."
},
/* 5 */
{
 text:"Pour f(x)=−3x+1, quel est un antécédent de 4 ?",
 choices:["1","−1","3","−3"],
 correct:1,
 explanation:"−3x+1=4 ⇒ x=−1."
},
/* 6 */
{
 text:"On considère la fonction g définie par le tableau suivant :",
 table:{
  headers:["x","−2","−1","0","1","2"],
  values:["g(x)","1","0","3","4","3"]
 },
 choices:["0","1","3","4"],
 correct:3,
 explanation:"À x=1 correspond g(1)=4."
},
/* 7 */
{
 text:"Avec ce tableau, quel est un antécédent de 3 ?",
 table:{
  headers:["x","−2","−1","0","1","2"],
  values:["g(x)","1","0","3","4","3"]
 },
 choices:["0","2","0 et 2","aucun"],
 correct:2,
 explanation:"g(0)=3 et g(2)=3."
},
/* 8 */
{
 text:"La courbe de h est donnée ci-dessous.",
 graph:{
  points:[{x:0,y:-1},{x:1,y:2},{x:3,y:0}]
 },
 choices:["h(0)=1","h(1)=2","h(2)=1","h(3)=1"],
 correct:1,
 explanation:"Le point (1,2) est sur la courbe."
},
/* 9 */
{
 text:"D’après le graphique, que représente 0 dans h(0)=−1 ?",
 choices:["Une image","Un antécédent","Un maximum","Un minimum"],
 correct:1,
 explanation:"0 est l’abscisse : un antécédent."
},
/* 10 */
{
 text:"La courbe coupe l’axe des abscisses en x=3. Que vaut h(3) ?",
 choices:["3","1","0","−3"],
 correct:2,
 explanation:"Sur l’axe des abscisses, l’ordonnée est 0."
},
/* 11 */
{
 text:"Pour f(x)=(x+1)/(x−4), quel est l’ensemble de définition ?",
 choices:["ℝ","ℝ\\{−1}","ℝ\\{4}","ℝ\\{−1,4}"],
 correct:2,
 explanation:"Le dénominateur ne doit pas être nul."
},
/* 12 */
{
 text:"Pour f(x)=√(5−x), quelle condition doit vérifier x ?",
 choices:["x≥5","x≤5","x>5","x<5"],
 correct:1,
 explanation:"5−x≥0 ⇒ x≤5."
},
/* 13 */
{
 text:"Pour f(x)=x²−4, quels sont les antécédents de 5 ?",
 choices:["3","−3","3 et −3","aucun"],
 correct:2,
 explanation:"x²=9 ⇒ x=±3."
},
/* 14 */
{
 text:"Tableau de la fonction k :",
 table:{
  headers:["x","−1","0","1","2"],
  values:["k(x)","2","1","0","−1"]
 },
 choices:["ℝ","{−1,0,1,2}","ℕ","ℝ⁺"],
 correct:1,
 explanation:"Le domaine est l’ensemble des x du tableau."
},
/* 15 */
{
 text:"Avec ce tableau, quelle affirmation est vraie ?",
 table:{
  headers:["x","−1","0","1","2"],
  values:["k(x)","2","1","0","−1"]
 },
 choices:["k(1)=1","k(0)=0","k(2)=−1","k(−1)=0"],
 correct:2,
 explanation:"On lit k(2)=−1."
}
];

let index = 0;

const qText = document.getElementById("qText");
const qHint = document.getElementById("qHint");
const answers = document.getElementById("answers");
const feedback = document.getElementById("feedback");

function renderTable(t){
 const d=document.createElement("div");
 d.className="math-box";
 d.innerHTML=`<table>
 <tr>${t.headers.map(h=>`<th>${h}</th>`).join("")}</tr>
 <tr>${t.values.map(v=>`<td>${v}</td>`).join("")}</tr>
 </table>`;
 return d;
}

/* REPÈRE ORTHONORMÉ GRADUÉ */
function renderGraph(g){
 const d=document.createElement("div");
 d.className="math-box";
 const scale=30, ox=120, oy=80;

 const ticks=[];
 for(let i=-3;i<=4;i++){
  ticks.push(`<line x1="${ox+i*scale}" y1="${oy-4}" x2="${ox+i*scale}" y2="${oy+4}" stroke="#94a3b8"/>`);
  ticks.push(`<text x="${ox+i*scale-4}" y="${oy+16}" font-size="10" fill="#e5e7eb">${i}</text>`);
  ticks.push(`<line x1="${ox-4}" y1="${oy-i*scale}" x2="${ox+4}" y2="${oy-i*scale}" stroke="#94a3b8"/>`);
  ticks.push(`<text x="${ox+8}" y="${oy-i*scale+4}" font-size="10" fill="#e5e7eb">${i}</text>`);
 }

 const pts=g.points.map(p=>
 `<circle cx="${ox+p.x*scale}" cy="${oy-p.y*scale}" r="4" fill="#fb923c"/>`
 ).join("");

 d.innerHTML=`
 <svg width="240" height="160">
  <line x1="0" y1="${oy}" x2="240" y2="${oy}" stroke="#64748b"/>
  <line x1="${ox}" y1="0" x2="${ox}" y2="160" stroke="#64748b"/>
  ${ticks.join("")}
  ${pts}
 </svg>`;
 return d;
}

function render(){
 const q=questions[index];
 qText.innerHTML=q.text;
 qHint.textContent="";
 answers.innerHTML="";
 feedback.textContent="";

 if(q.table) qText.appendChild(renderTable(q.table));
 if(q.graph) qText.appendChild(renderGraph(q.graph));

 q.choices.forEach((c,i)=>{
  const b=document.createElement("button");
  b.className="answer";
  b.textContent=c;
  b.onclick=()=>{
   if(i===q.correct){
    b.classList.add("correct");
    feedback.textContent="Bonne réponse. "+q.explanation;
    feedback.className="feedback ok";
   } else {
    b.classList.add("wrong");
    feedback.textContent="Mauvaise réponse. "+q.explanation;
    feedback.className="feedback ko";
   }
  };
  answers.appendChild(b);
 });
}

document.getElementById("prev").onclick=()=>{ if(index>0){index--;render();}};
document.getElementById("next").onclick=()=>{ if(index<questions.length-1){index++;render();}};
render();
</script>
</body>
</html>
