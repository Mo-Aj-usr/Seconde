<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>QCM Maths 2nde – Nombres & Fonctions</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:system-ui;background:#0f172a;color:#e5e7eb;margin:0}
header{padding:1rem;text-align:center;background:#020617}
.container{max-width:900px;margin:auto;padding:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
.card{background:#1e293b;border-radius:14px;padding:1rem;box-shadow:0 10px 20px rgba(0,0,0,.3)}
.card button{width:100%;padding:.7rem;border:none;border-radius:10px;background:#38bdf8;color:#020617;font-weight:700}
.quiz{display:none}
.progress{margin:.5rem 0;color:#94a3b8}
.answers label{display:block;background:#0b1220;margin:.4rem 0;padding:.6rem;border-radius:10px;cursor:pointer}
.answers label.good{background:#14532d}
.answers label.bad{background:#7f1d1d}
.nav{display:flex;gap:.5rem;margin-top:1rem}
.nav button{flex:1;padding:.7rem;border:none;border-radius:10px;background:#38bdf8;color:#020617;font-weight:700}
.nav .end{background:#22c55e}
.feedback{margin-top:.4rem;font-weight:700}
.result{background:#020617;padding:1rem;border-radius:12px;margin-top:1rem}
.hidden{display:none}
</style>
</head>
<body>

<header>
  <h1>Maths 2nde – Nombres & Fonctions</h1>
  <p>Ensembles – Intervalles – Valeur absolue – Fonctions – Lecture graphique</p>
</header>

<div class="container">
  <div id="dashboard" class="grid"></div>

  <div id="quiz" class="quiz card">
    <div class="progress" id="progress"></div>
    <h2 id="question"></h2>
    <div class="answers" id="answers"></div>
    <div id="feedback" class="feedback"></div>
    <div class="nav">
      <button onclick="prev()">Précédent</button>
      <button onclick="next()">Suivant</button>
      <button class="end" onclick="finish()">Terminer</button>
    </div>
    <div id="result" class="result hidden"></div>
  </div>
</div>

<script>
const quizzes = [{
title:"Devoir – Nombres & Fonctions",
q:[
{q:"Le nombre √2 appartient à :",a:["ℕ","ℤ","ℚ","ℝ\\ℚ"],c:3,e:"√2 est irrationnel : il appartient à ℝ mais pas à ℚ."},
{q:"Encadrement de √5 au dixième :",a:["2,1 < √5 < 2,2","2,2 < √5 < 2,3","2,3 < √5 < 2,4","2,4 < √5 < 2,5"],c:1,e:"√5 ≈ 2,236 donc 2,2 < √5 < 2,3."},
{q:"Traduire x ≥ -1 en intervalle :",a:["]-1; +∞[","[-1; +∞[","]-∞; -1]","[-1; 1]"],c:1,e:"Le crochet fermé correspond à ≥ : [-1; +∞[."},
{q:"Traduire ]2;5] en inégalité :",a:["2 < x < 5","2 ≤ x ≤ 5","2 < x ≤ 5","2 ≤ x < 5"],c:2,e:"]2;5] signifie strictement >2 et ≤5."},
{q:"A=[-2;3] et B=[1;5]. A∩B vaut :",a:["[-2;5]","[1;3]","]1;3[","[-2;1]"],c:1,e:"Intersection = valeurs communes : de 1 à 3."},
{q:"A=[-2;3] et B=[1;5]. A∪B vaut :",a:["[-2;5]","[1;3]","]1;3[","[-2;1]"],c:0,e:"Union = tout ce qui est dans A ou B : [-2;5]."},
{q:"|x| ≤ 3 équivaut à :",a:["x ≤ -3 ou x ≥ 3","-3 ≤ x ≤ 3","x ≥ 3","x ≤ -3"],c:1,e:"|x| ≤ a ⇔ -a ≤ x ≤ a."},
{q:"|x| ≥ 2 équivaut à :",a:["-2 ≤ x ≤ 2","x ≥ 2","x ≤ -2","x ≤ -2 ou x ≥ 2"],c:3,e:"|x| ≥ a ⇔ x ≤ -a ou x ≥ a."},
{q:"Résoudre |x-1| = 3 :",a:["x=4","x=-2","x=4 ou x=-2","x=2"],c:2,e:"|x-1|=3 ⇒ x-1=3 ou x-1=-3."},
{q:"Domaine de f(x)=1/(x-2) :",a:["ℝ","ℝ\\{2}","ℝ⁺","[-2;2]"],c:1,e:"Le dénominateur ne doit pas être nul : x≠2."},
{q:"Si f(x)=2x+1, alors f(3) vaut :",a:["5","6","7","8"],c:2,e:"f(3)=2×3+1=7."},
{q:"Un antécédent de 5 par f(x)=2x+1 est :",a:["1","2","3","4"],c:1,e:"2x+1=5 ⇒ x=2."},
{q:"Dire que (2;5) est sur Cf signifie :",a:["f(5)=2","f(2)=5","f(x)=7","x=5"],c:1,e:"Un point (x;y) est sur la courbe si f(x)=y."},
{q:"Graphiquement, résoudre f(x)=0 revient à :",a:["lire une ordonnée","chercher les intersections avec l’axe des abscisses","tracer un tableau","calculer f(0)"],c:1,e:"Les solutions sont les abscisses des points où la courbe coupe l’axe x."},
{q:"Si f est définie sur [-2;4], alors :",a:["x∈ℝ","x∈[-2;4]","f(x)>0","f est linéaire"],c:1,e:"Le domaine de définition est l’ensemble des x autorisés."}
]}];

const dash=document.getElementById("dashboard");
quizzes.forEach((q,i)=>{
  const d=document.createElement("div");
  d.className="card";
  d.innerHTML=`<h3>${q.title}</h3><button onclick="start(${i})">Commencer</button>`;
  dash.appendChild(d);
});

let qi=0,ci=0,answers=[];
function start(i){
  qi=i;ci=0;answers=Array(quizzes[qi].q.length).fill(null);
  dash.style.display="none";
  document.getElementById("quiz").style.display="block";
  render();
}
function render(){
  const Q=quizzes[qi].q[ci];
  progress.textContent=`Question ${ci+1}/${quizzes[qi].q.length}`;
  question.textContent=Q.q;
  answersDiv.innerHTML=""; feedback.textContent="";
  Q.a.forEach((t,i)=>{
    const l=document.createElement("label");
    l.innerHTML=`<input type="radio" name="r"> ${t}`;
    l.onclick=()=>select(i);
    if(answers[ci]!=null){
      if(i===Q.c) l.classList.add("good");
      else if(i===answers[ci]) l.classList.add("bad");
    }
    answersDiv.appendChild(l);
  });
}
const answersDiv=document.getElementById("answers");
const feedback=document.getElementById("feedback");
function select(i){
  answers[ci]=i; render();
  const Q=quizzes[qi].q[ci];
  feedback.textContent=(i===Q.c?"✔ ":"✘ ")+Q.e;
}
function next(){ if(ci<quizzes[qi].q.length-1){ci++;render();}}
function prev(){ if(ci>0){ci--;render();}}
function finish(){
  let s=0; const Q=quizzes[qi].q;
  Q.forEach((x,i)=>{if(answers[i]===x.c)s++;});
  const r=document.getElementById("result");
  r.classList.remove("hidden");
  r.innerHTML=`Score : <b>${s}/${Q.length}</b><hr>`+
  Q.map((x,i)=>`<b>Q${i+1}</b> ${x.q}<br>✔ ${x.a[x.c]}<br>🧠 ${x.e}<br><br>`).join("");
}
</script>
</body>
</html>
