<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCM Fonctions 1 - 2de</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f7f9fc;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .quiz-container {
    background: #ffffff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    max-width: 600px;
    width: 90%;
  }
  h1 {
    text-align: center;
    color: #2c3e50;
  }
  .question {
    font-size: 1.1em;
    margin-bottom: 15px;
    color: #34495e;
  }
  .options {
    list-style: none;
    padding: 0;
  }
  .options li {
    margin-bottom: 10px;
  }
  button.option-btn {
    width: 100%;
    padding: 10px;
    background-color: #3498db;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1em;
    transition: background 0.3s;
  }
  button.option-btn:hover {
    background-color: #2980b9;
  }
  .navigation {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
  }
  button.nav-btn {
    padding: 10px 20px;
    background-color: #2ecc71;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1em;
  }
  button.nav-btn:disabled {
    background-color: #95a5a6;
    cursor: not-allowed;
  }
  .feedback {
    margin-top: 10px;
    font-weight: bold;
  }
  .correct { color: #27ae60; }
  .incorrect { color: #e74c3c; }
  .results { margin-top: 20px; }
  .results h2 { text-align: center; color: #2c3e50; }
  .results ul { list-style: none; padding: 0; }
  .results li { margin-bottom: 10px; }
  .answer-correct { color: #27ae60; }
</style>
</head>
<body>
<div class="quiz-container">
  <h1>QCM Fonctions - 2de</h1>
  <div id="quiz"></div>
  <div class="navigation">
    <button id="prevBtn" class="nav-btn" disabled>Précédent</button>
    <div>
      <button id="nextBtn" class="nav-btn">Suivant</button>
      <button id="finishBtn" class="nav-btn">Terminer</button>
    </div>
  </div>
</div>

<script>
const quizData = [
  {question: "1) Quelle est l'image de x = 2 par la fonction f(x) = 3x + 1 ?", options: ["5", "6", "7", "8"], answer: "7"},
  {question: "2) Quel est le domaine de définition de f(x) = 1/(x-3) ?", options: ["R", "R \ {3}", "R+", "R-"], answer: "R \ {3}"},
  {question: "3) Si f(x) = x², quel est l'antécédent de 9 ?", options: ["3", "-3", "3 et -3", "aucun"], answer: "3 et -3"},
  {question: "4) Pour f(x) = 2x - 5, quelle est f(0) ?", options: ["-5", "5", "0", "2"], answer: "-5"},
  {question: "5) Quelle est l'image de x = -1 par f(x) = x³ ?", options: ["1", "-1", "0", "-3"], answer: "-1"},
  {question: "6) Si f(x) = √x, quel est le domaine de définition ?", options: ["R", "R+", "R-", "R \ {0}"], answer: "R+"},
  {question: "7) Pour f(x) = x² + 2, quel est l'antécédent de 6 ?", options: ["2", "-2", "2 et -2", "aucun"], answer: "2 et -2"},
  {question: "8) La fonction f(x) = -x + 4 est-elle croissante ou décroissante ?", options: ["Croissante", "Décroissante", "Constante", "Aucune"], answer: "Décroissante"},
  {question: "9) Résoudre l'équation f(x) = x + 1 = 4.", options: ["x = 3", "x = 5", "x = -3", "x = 4"], answer: "x = 3"},
  {question: "10) Si f(x) = 2x + 3, quelle est f(5) ?", options: ["10", "13", "15", "8"], answer: "13"}
];

let currentQuestion = 0;
let userAnswers = Array(quizData.length).fill(null);
const quiz = document.getElementById('quiz');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const finishBtn = document.getElementById('finishBtn');

function loadQuestion() {
  const q = quizData[currentQuestion];
  let html = `<div class='question'>${q.question}</div><ul class='options'>`;
  q.options.forEach(opt => {
    html += `<li><button class='option-btn' onclick='checkAnswer(this,"${q.answer}")'>${opt}</button></li>`;
  });
  html += `</ul><div class='feedback' id='feedback'></div>`;
  quiz.innerHTML = html;
  prevBtn.disabled = currentQuestion === 0;
  nextBtn.disabled = currentQuestion === quizData.length - 1;
}

function checkAnswer(btn, answer) {
  const feedback = document.getElementById('feedback');
  userAnswers[currentQuestion] = btn.textContent;
  if(btn.textContent === answer){
    feedback.textContent = '✔ Correct !';
    feedback.className = 'feedback correct';
  } else {
    feedback.textContent = `✖ Incorrect ! La bonne réponse est ${answer}`;
    feedback.className = 'feedback incorrect';
  }
}

prevBtn.addEventListener('click', () => {
  if(currentQuestion > 0){
    currentQuestion--;
    loadQuestion();
  }
});

nextBtn.addEventListener('click', () => {
  if(currentQuestion < quizData.length - 1){
    currentQuestion++;
    loadQuestion();
  }
});

finishBtn.addEventListener('click', () => {
  showResults();
});

function showResults() {
  let html = `<div class='results'><h2>Résultats et corrections</h2><ul>`;
  quizData.forEach((q, i) => {
    const user = userAnswers[i] ? userAnswers[i] : 'Non répondu';
    const correct = q.answer;
    const correctClass = user === correct ? 'answer-correct' : 'incorrect';
    html += `<li><strong>Q${i+1}:</strong> ${q.question}<br>Votre réponse: <span class='${correctClass}'>${user}</span><br>Réponse correcte: <span class='answer-correct'>${correct}</span></li>`;
  });
  html += `</ul></div>`;
  quiz.innerHTML = html;
  prevBtn.style.display = 'none';
  nextBtn.style.display = 'none';
  finishBtn.style.display = 'none';
}

loadQuestion();
</script>
</body>
</html>
