<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Maths 2nde – QCM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:system-ui;background:#0f172a;color:#e5e7eb;margin:0}
header{padding:1rem;text-align:center;background:#020617}
.container{max-width:1000px;margin:auto;padding:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem}
.card{background:#1e293b;border-radius:14px;padding:1rem;box-shadow:0 10px 20px rgba(0,0,0,.3)}
.card button{width:100%;padding:.7rem;border:none;border-radius:10px;background:#38bdf8;color:#020617;font-weight:700}
.quiz{display:none}
.progress{margin:.5rem 0;color:#94a3b8}
.answers label{display:block;background:#0b1220;margin:.4rem 0;padding:.6rem;border-radius:10px;cursor:pointer}
.answers label.good{background:#14532d}
.answers label.bad{background:#7f1d1d}
.nav{display:flex;gap:.5rem;margin-top:1rem}
.nav button{flex:1;padding:.7rem;border:none;border-radius:10px;background:#38bdf8;color:#020617;font-weight:700}
.nav .end{background:#22c55e}
.feedback{margin-top:.4rem;font-weight:700}
.result{background:#020617;padding:1rem;border-radius:12px;margin-top:1rem}
.hidden{display:none}
svg{background:#020617;border-radius:8px;margin:.5rem 0}
</style>
</head>
<body>

<header>
  <h1>Maths 2nde – Nombres & Fonctions</h1>
  <p>Intervalles – Valeur absolue – Fonctions – Lecture graphique</p>
</header>

<div class="container">
  <div id="dashboard" class="grid"></div>

  <div id="quiz" class="quiz card">
    <div class="progress" id="progress"></div>
    <h2 id="question"></h2>
    <div class="answers" id="answers"></div>
    <div id="feedback" class="feedback"></div>
    <div class="nav">
      <button onclick="prev()">Précédent</button>
      <button onclick="next()">Suivant</button>
      <button class="end" onclick="finish()">Terminer</button>
    </div>
    <div id="result" class="result hidden"></div>
  </div>
</div>

<script>
const g1 = `
<svg width="260" height="180" viewBox="0 0 260 180">
<rect x="0" y="0" width="260" height="180" fill="#020617"/>
<line x1="30" y1="150" x2="240" y2="150" stroke="white"/>
<line x1="130" y1="20" x2="130" y2="170" stroke="white"/>
${[-4,-3,-2,-1,0,1,2,3,4].map(v=>`
<line x1="${130+v*25}" y1="146" x2="${130+v*25}" y2="154" stroke="white"/>
<text x="${130+v*25-4}" y="168" fill="white" font-size="10">${v}</text>`).join("")}
${[-3,-2,-1,0,1,2,3].map(v=>`
<line x1="126" y1="${150-v*25}" x2="134" y2="${150-v*25}" stroke="white"/>
<text x="100" y="${154-v*25}" fill="white" font-size="10">${v}</text>`).join("")}
<line x1="30" y1="175" x2="240" y2="45" stroke="#38bdf8" stroke-width="3"/>
</svg>`;

const g2 = `
<svg width="260" height="180" viewBox="0 0 260 180">
<rect x="0" y="0" width="260" height="180" fill="#020617"/>
<line x1="30" y1="150" x2="240" y2="150" stroke="white"/>
<line x1="130" y1="20" x2="130" y2="170" stroke="white"/>
${[-4,-3,-2,-1,0,1,2,3,4].map(v=>`
<line x1="${130+v*25}" y1="146" x2="${130+v*25}" y2="154" stroke="white"/>
<text x="${130+v*25-4}" y="168" fill="white" font-size="10">${v}</text>`).join("")}
${[-3,-2,-1,0,1,2,3].map(v=>`
<line x1="126" y1="${150-v*25}" x2="134" y2="${150-v*25}" stroke="white"/>
<text x="100" y="${154-v*25}" fill="white" font-size="10">${v}</text>`).join("")}
<path d="M30 150 Q130 20 240 150" fill="none" stroke="#22c55e" stroke-width="3"/>
</svg>`;

const g3 = `
<svg width="260" height="180" viewBox="0 0 260 180">
<rect x="0" y="0" width="260" height="180" fill="#020617"/>
<line x1="30" y1="150" x2="240" y2="150" stroke="white"/>
<line x1="130" y1="20" x2="130" y2="170" stroke="white"/>
${[-4,-3,-2,-1,0,1,2,3,4].map(v=>`
<line x1="${130+v*25}" y1="146" x2="${130+v*25}" y2="154" stroke="white"/>
<text x="${130+v*25-4}" y="168" fill="white" font-size="10">${v}</text>`).join("")}
${[-3,-2,-1,0,1,2,3].map(v=>`
<line x1="126" y1="${150-v*25}" x2="134" y2="${150-v*25}" stroke="white"/>
<text x="100" y="${154-v*25}" fill="white" font-size="10">${v}</text>`).join("")}
<polyline points="30,120 80,80 130,110 180,60 240,90" fill="none" stroke="#f59e0b" stroke-width="3"/>
</svg>`;

const quizzes = [
{
title:"QCM 1 – Rappels",
q:[
{q:"Le nombre √2 appartient à :",a:["ℕ","ℤ","ℚ","ℝ\\ℚ"],c:3,e:"√2 est irrationnel."},
{q:"Traduire x ≥ -1 :",a:["]-1;+∞[","[-1;+∞[","]-∞;-1]","[-1;1]"],c:1,e:"≥ correspond à un crochet fermé."},
{q:"|x| ≤ 3 équivaut à :",a:["x≤-3 ou x≥3","-3≤x≤3","x≥3","x≤-3"],c:1,e:"Règle fondamentale."},
{q:"Domaine de f(x)=1/(x-2) :",a:["ℝ","ℝ\\{2}","ℝ⁺","[-2;2]"],c:1,e:"On exclut x=2."},
{q:"f(x)=2x+1, f(3) :",a:["5","6","7","8"],c:2,e:"Calcul direct."},
{q:"Antécédent de 5 :",a:["1","2","3","4"],c:1,e:"2x+1=5 ⇒ x=2."},
{q:"(2;5) sur Cf signifie :",a:["f(5)=2","f(2)=5","x=5","y=2"],c:1,e:"Définition."},
{q:"Résoudre f(x)=0 graphiquement :",a:["Lire y","Intersection axe x","Tableau","Calcul"],c:1,e:"Méthode graphique."},
{q:"A=[-2;3], B=[1;5], A∩B :",a:["[-2;5]","[1;3]","[-2;1]","[3;5]"],c:1,e:"Valeurs communes."},
{q:"|x-1|=3 :",a:["x=4","x=-2","x=4 ou -2","x=2"],c:2,e:"Deux solutions."},
{q:"Un irrationnel :",a:["dans ℚ","dans ℤ","dans ℝ\\ℚ","dans ℕ"],c:2,e:"Ex : √2."},
{q:"Encadrement de √5 :",a:["2<√5<3","2,2<√5<2,3","2,3<√5<2,4","2,1<√5<2,2"],c:1,e:"√5≈2,236."},
{q:"Union de [-2;3] et [1;5] :",a:["[-2;5]","[1;3]","[-2;1]","[3;5]"],c:0,e:"On réunit."},
{q:"|x|≥2 :",a:["-2≤x≤2","x≥2","x≤-2","x≤-2 ou x≥2"],c:3,e:"Deux intervalles."},
{q:"Domaine [-2;4] :",a:["ℝ","[-2;4]","]−∞;4]","[-2;+∞["],c:1,e:"Définition."}
]
},
{
title:"QCM 2 – Lecture graphique",
q:[
{q:`${g1}<br>Image de 0 :`,a:["-1","0","1","2"],c:2,e:"À x=0, y≈1."},
{q:`${g1}<br>Résoudre f(x)=0 :`,a:["-1","0","1","2"],c:0,e:"Intersection avec l’axe x."},
{q:`${g1}<br>(1;0) est-il sur la courbe ?`,a:["Oui","Non","Parfois","NSP"],c:1,e:"f(1)≠0."},
{q:`${g2}<br>Image de 0 :`,a:["0","1","2","3"],c:2,e:"Lecture graphique."},
{q:`${g2}<br>Nombre d’antécédents de 1 :`,a:["0","1","2","3"],c:2,e:"Deux intersections."},
{q:`${g2}<br>La fonction est :`,a:["décroissante","constante","croissante puis décroissante","affine"],c:2,e:"Forme en cloche."},
{q:`${g3}<br>Image de 1 :`,a:["0","1","2","3"],c:1,e:"Lecture graphique."},
{q:`${g3}<br>Résoudre f(x)=1 :`,a:["1 sol.","2 sol.","3 sol.","0"],c:1,e:"Deux points."},
{q:`${g3}<br>(2;2) appartient ?`,a:["Oui","Non","Parfois","NSP"],c:1,e:"Lecture."},
{q:`${g1}<br>La fonction est :`,a:["croissante","décroissante","constante","non définie"],c:0,e:"Droite montante."},
{q:`${g2}<br>Domaine visible :`,a:["[-4;4]","[0;4]","[-3;3]","ℝ"],c:2,e:"Lecture axe x."},
{q:`${g3}<br>Nombre de zéros :`,a:["0","1","2","3"],c:2,e:"Deux intersections."},
{q:`${g1}<br>Image de -1 :`,a:["0","1","2","-1"],c:0,e:"Intersection."},
{q:`${g2}<br>f(x)=3 a :`,a:["0","1","2","∞"],c:1,e:"Une intersection."},
{q:`${g3}<br>La fonction est :`,a:["monotone","affine","ni affine ni monotone","constante"],c:2,e:"Variations multiples."}
]
}
];

const dash=document.getElementById("dashboard");
quizzes.forEach((q,i)=>{
  const d=document.createElement("div");
  d.className="card";
  d.innerHTML=`<h3>${q.title}</h3><button onclick="start(${i})">Commencer</button>`;
  dash.appendChild(d);
});

let qi=0,ci=0,answers=[];
const answersDiv=document.getElementById("answers");
const feedback=document.getElementById("feedback");

function start(i){
  qi=i;ci=0;answers=Array(quizzes[qi].q.length).fill(null);
  dash.style.display="none";
  document.getElementById("quiz").style.display="block";
  render();
}
function render(){
  const Q=quizzes[qi].q[ci];
  progress.textContent=`Question ${ci+1}/${quizzes[qi].q.length}`;
  question.innerHTML=Q.q;
  answersDiv.innerHTML=""; feedback.textContent="";
  Q.a.forEach((t,i)=>{
    const l=document.createElement("label");
    l.innerHTML=`<input type="radio" name="r"> ${t}`;
    l.onclick=()=>select(i);
    if(answers[ci]!=null){
      if(i===Q.c) l.classList.add("good");
      else if(i===answers[ci]) l.classList.add("bad");
    }
    answersDiv.appendChild(l);
  });
}
function select(i){
  answers[ci]=i; render();
  const Q=quizzes[qi].q[ci];
  feedback.textContent=(i===Q.c?"✔ ":"✘ ")+Q.e;
}
function next(){ if(ci<quizzes[qi].q.length-1){ci++;render();}}
function prev(){ if(ci>0){ci--;render();}}
function finish(){
  let s=0; const Q=quizzes[qi].q;
  Q.forEach((x,i)=>{if(answers[i]===x.c)s++;});
  const r=document.getElementById("result");
  r.classList.remove("hidden");
  r.innerHTML=`Score : <b>${s}/${Q.length}</b><hr>`+
  Q.map((x,i)=>`<b>Q${i+1}</b><br>${x.q}<br>✔ ${x.a[x.c]}<br>🧠 ${x.e}<br><br>`).join("");
}
</script>
</body>
</html>
