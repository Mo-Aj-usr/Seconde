<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCM Chimie 2nde - Électrons</title>
<style>
body {
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: 40px auto;
    background-color: #f9f9f9;
    color: #333;
    line-height: 1.6;
}
h1 {
    text-align: center;
    color: #2c3e50;
}
.quiz-container {
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}
.question {
    margin-bottom: 30px;
    display: none;
}
.question.active {
    display: block;
}
.question-number {
    font-size: 1.2em;
    font-weight: bold;
    color: #2980b9;
}
.options label {
    display: block;
    margin: 10px 0;
    padding: 10px;
    background: #ecf0f1;
    border-radius: 5px;
    cursor: pointer;
}
.options input[type="radio"] {
    margin-right: 10px;
}
.buttons {
    text-align: center;
    margin: 30px 0;
}
button {
    padding: 10px 20px;
    margin: 0 10px;
    font-size: 1em;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
#prevBtn { background: #95a5a6; color: white; }
#nextBtn { background: #27ae60; color: white; }
#submitBtn { background: #c0392b; color: white; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.result {
    margin-top: 30px;
    padding: 20px;
    background: #e8f4fc;
    border-radius: 8px;
}
.correction {
    margin-top: 15px;
    padding: 15px;
    background: #f2f2f2;
    border-left: 5px solid #2980b9;
}
.correct { color: #27ae60; font-weight: bold; }
.incorrect { color: #c0392b; font-weight: bold; }
.feedback {
    margin-top: 10px;
    padding: 10px;
    border-radius: 5px;
    display: none;
    font-weight: bold;
}
.feedback.correct { background: #2ecc71; color: white; }
.feedback.incorrect { background: #e74c3c; color: white; }
</style>
</head>
<body>
<div class="quiz-container">
<h1>QCM Chimie 2nde - Électrons<br><small>Constitution et transformation de la matière</small></h1>

<form id="quizForm">
    <!-- Questions générées ici comme précédemment -->
    <!-- Exemples pour 2 questions seulement, tu peux répéter pour 15 -->
    <div class="question active">
        <div class="question-number">Question 1</div>
        <p>Pourquoi les gaz nobles comme l'hélium, le néon et l'argon sont-ils considérés comme chimiquement stables ?</p>
        <div class="options">
            <label><input type="radio" name="q1" value="A"> A) Leur couche de valence est vide.</label>
            <label><input type="radio" name="q1" value="B"> B) Leur couche de valence est saturée (pleine).</label>
            <label><input type="radio" name="q1" value="C"> C) Ils ont un nombre impair d'électrons de valence.</label>
            <label><input type="radio" name="q1" value="D"> D) Leur noyau est instable.</label>
        </div>
        <div class="feedback" id="feedback-q1"></div>
    </div>

    <div class="question">
        <div class="question-number">Question 2</div>
        <p>Quel est le numéro atomique (Z) de l'élément sodium (Na) ?</p>
        <div class="options">
            <label><input type="radio" name="q2" value="A"> A) 10</label>
            <label><input type="radio" name="q2" value="B"> B) 11</label>
            <label><input type="radio" name="q2" value="C"> C) 12</label>
            <label><input type="radio" name="q2" value="D"> D) 23</label>
        </div>
        <div class="feedback" id="feedback-q2"></div>
    </div>

    <div class="buttons">
        <button type="button" id="prevBtn" onclick="changeQuestion(-1)" disabled>Précédent</button>
        <button type="button" id="nextBtn" onclick="changeQuestion(1)">Suivant</button>
        <button type="button" id="submitBtn" onclick="showResults()">Terminer</button>
    </div>
</form>

<div id="result" class="result"></div>
</div>

<script>
let currentQuestion = 0;
const questions = document.querySelectorAll('.question');
const totalQuestions = questions.length;

const correctAnswers = { q1: "B", q2: "B" }; // Compléter pour toutes les 15 questions
const explanations = { 
    q1: "Les gaz nobles ont leur couche de valence saturée (pleine), ce qui les rend stables.", 
    q2: "Le sodium a Z = 11 (11 protons)." 
};

function showQuestion(n){
    questions.forEach(q=>q.classList.remove('active'));
    questions[n].classList.add('active');
    document.getElementById('prevBtn').disabled = n===0;
    document.getElementById('nextBtn').disabled = n===totalQuestions-1;
}

function changeQuestion(step){
    currentQuestion += step;
    showQuestion(currentQuestion);
}

questions.forEach((q,i)=>{
    const radios = q.querySelectorAll('input[type="radio"]');
    radios.forEach(r=>{
        r.addEventListener('change',()=>{
            const feedback = q.querySelector('.feedback');
            const qName = r.name;
            if(r.value === correctAnswers[qName]){
                feedback.innerText = "Correct ! " + explanations[qName];
                feedback.className = "feedback correct";
            } else {
                feedback.innerText = "Incorrect. " + explanations[qName];
                feedback.className = "feedback incorrect";
            }
            feedback.style.display = "block";
        });
    });
});

function showResults(){
    let score = 0;
    let resultHTML = `<h2>Résultat :</h2>`;
    for(let i=0;i<totalQuestions;i++){
        const q = questions[i];
        const qName = q.querySelector('input[type="radio"]').name;
        const selected = q.querySelector('input[type="radio"]:checked');
        const correct = correctAnswers[qName];
        const userAnswer = selected ? selected.value : "Aucune réponse";
        const isCorrect = selected && selected.value === correct;
        if(isCorrect) score++;
        resultHTML += `<div class="correction"><strong>Question ${i+1} :</strong> ${isCorrect?"Correct":"Incorrect"} 
            <span class="${isCorrect?"correct":"incorrect"}">(Votre réponse: ${userAnswer} | Bonne réponse: ${correct})</span>
            <br>${explanations[qName]}</div>`;
    }
    resultHTML = `<h3>Score : ${score}/${totalQuestions}</h3>` + resultHTML;
    document.getElementById('result').innerHTML = resultHTML;
    document.getElementById('quizForm').style.display='none';
}

// Initialisation
showQuestion(currentQuestion);
</script>
</body>
</html>
