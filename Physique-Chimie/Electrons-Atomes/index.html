<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="QCM interactifs pour réviser le chapitre Électrons et Atomes – Physique-Chimie Seconde">
    <title>Électrons & Atomes – QCM Seconde Physique-Chimie</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #e8f0fe 0%, #c5d9fa 100%);
            min-height: 100vh;
            padding: 40px 15px;
            color: #0d47a1;
            line-height: 1.6;
        }
        header {
            text-align: center;
            margin-bottom: 50px;
        }
        h1 {
            color: #1565c0;
            font-size: clamp(2.4rem, 7vw, 3.8rem);
            margin-bottom: 10px;
        }
        .subtitle {
            color: #455a64;
            font-size: 1.3rem;
            max-width: 720px;
            margin: 0 auto;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 28px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 32px 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .card:hover {
            transform: translateY(-12px);
            box-shadow: 0 22px 45px rgba(0,0,0,0.15);
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 8px;
            background: linear-gradient(to right, #42a5f5, #1976d2);
        }
        .card h2 {
            color: #0d47a1;
            margin-bottom: 16px;
            font-size: 1.7rem;
            text-align: center;
        }
        .card .action {
            text-align: center;
            color: #546e7a;
            font-size: 1.1rem;
            font-weight: 500;
        }
        footer {
            text-align: center;
            margin-top: 80px;
            color: #607d8b;
            font-size: 0.95rem;
        }
        @media (max-width: 600px) {
            .grid { gap: 20px; }
            .card { padding: 24px 18px; }
            h1 { font-size: 2.6rem; }
        }
    </style>
</head>
<body>

<header>
    <h1>⚛️ Électrons & Atomes</h1>
    <div class="subtitle">
        QCM interactifs – Physique-Chimie Seconde<br>
        Constitution de la matière – Cortège électronique – Stabilité chimique
    </div>
</header>

<div class="grid" id="qcms"></div>

<footer>
    Plateforme d’entraînement – Seconde – 2025-2026<br>
    Conforme au programme officiel de Physique-Chimie
</footer>

<script>
const qcms = [
    { nom: "QCM 1", fichier: "qcm1.html" },
    { nom: "QCM 2", fichier: "qcm2.html" },
    { nom: "QCM 3", fichier: "qcm3.html" },
    { nom: "QCM 4", fichier: "qcm4.html" },
    { nom: "QCM 5", fichier: "qcm5.html" },
    { nom: "QCM 6", fichier: "qcm6.html" },
    { nom: "QCM 7", fichier: "qcm7.html" },
    { nom: "QCM 8", fichier: "qcm8.html" },
    { nom: "QCM 9", fichier: "qcm9.html" },
    { nom: "QCM 10", fichier: "qcm10.html" },
    { nom: "QCM 11", fichier: "qcm11.html" }
];

const container = document.getElementById("qcms");

qcms.forEach(qcm => {
    const card = document.createElement("div");
    card.className = "card";
    
    card.innerHTML = `
        <h2>${qcm.nom}</h2>
        <div class="action">→ Démarrer ce QCM</div>
    `;
    
    card.onclick = () => {
        card.style.transform = "scale(0.96)";
        setTimeout(() => {
            window.open(qcm.fichier, "_blank");
            card.style.transform = "";
        }, 160);
    };
    
    container.appendChild(card);
});
</script>
</body>
</html>
