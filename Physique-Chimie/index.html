<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physique-Chimie – Plateforme QCM</title>
<style>
    body {
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: linear-gradient(135deg, #ff9a8b, #ff6a88, #fecfef, #a8edea);
        background-size: 400% 400%;
        animation: gradientShift 15s ease infinite;
        min-height: 100vh;
        padding: 30px;
        color: #2d3436;
        margin: 0;
    }

    @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    h1 {
        text-align: center;
        color: white;
        margin-bottom: 15px;
        font-size: 2.8em;
        text-shadow: 0 4px 15px rgba(0,0,0,0.3);
        font-weight: 800;
    }

    .subtitle {
        text-align: center;
        color: rgba(255,255,255,0.95);
        margin-bottom: 50px;
        font-size: 1.3em;
        font-weight: 400;
        text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 30px;
        max-width: 1400px;
        margin: auto;
        padding: 0 20px;
    }

    .card {
        background: rgba(255,255,255,0.95);
        backdrop-filter: blur(15px);
        border-radius: 24px;
        padding: 35px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        cursor: pointer;
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.2);
    }

    .card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #ff6b6b, #4ecdc4, #45b7d1, #f9ca24);
        opacity: 0;
        transition: opacity 0.3s;
    }

    .card:hover {
        transform: translateY(-12px) scale(1.02);
        box-shadow: 0 35px 80px rgba(0,0,0,0.35);
        background: rgba(255,255,255,1);
    }

    .card:hover::before {
        opacity: 1;
    }

    .card h2 {
        margin-bottom: 18px;
        font-size: 1.6em;
        font-weight: 700;
        color: #2d3436;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .card p {
        line-height: 1.7;
        color: #5a6773;
        font-size: 1em;
        margin-bottom: 20px;
    }

    .card-badge {
        display: inline-flex;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 8px 20px;
        border-radius: 25px;
        font-size: 0.85em;
        font-weight: 600;
        margin-top: 15px;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .launch-btn {
        background: linear-gradient(135deg, #ff6b6b, #ee5a52);
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 25px;
        font-weight: 700;
        font-size: 1em;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
        box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
        width: 100%;
    }

    .launch-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 35px rgba(255, 107, 107, 0.6);
    }

    footer {
        margin-top: 80px;
        text-align: center;
        color: rgba(255,255,255,0.9);
        font-size: 0.95em;
        padding: 30px 0;
        border-top: 1px solid rgba(255,255,255,0.2);
    }

    @media (max-width: 768px) {
        body { padding: 20px 10px; }
        h1 { font-size: 2.2em; }
        .grid { grid-template-columns: 1fr; gap: 25px; }
        .card { padding: 25px; }
    }
</style>
</head>

<body>

<h1>🔬 Physique-Chimie Seconde</h1>
<div class="subtitle">
    Plateforme interactive QCM – Programme Eduscol 2025-2026<br>
    <small>Entraînement interactif par chapitres</small>
</div>

<div class="grid" id="matieres"></div>

<footer>
    © 2025-2026 MoIAj – Plateforme pédagogique Seconde Physique-Chimie<br>
    <small>Conforme programme officiel Eduscol</small>
</footer>

<script>
const chapitres = [
    { 
        nom: "Matière Microscopique", 
        dossier: "Microscopique", 
        icon: "🔬",
        desc: "Atomes, ions, molécules, tableau périodique<br>10 QCM interactifs (noyau, cortège électronique, électroneutralité)",
        qcmCount: 10
    },
    { 
        nom: "Optique", 
        dossier: "Optique", 
        icon: "🔍",
        desc: "Réflexion, réfraction, lentilles<br>8 QCM sur miroirs, dioptres, lentilles convergentes",
        qcmCount: 8
    },
    { 
        nom: "Thermodynamique", 
        dossier: "Thermodynamique", 
        icon: "🌡️",
        desc: "Chaleur, travail, 1ᵉʳ principe<br>9 QCM (énergies internes, transformations, gaz parfaits)",
        qcmCount: 9
    },
    { 
        nom: "Mécanique", 
        dossier: "Mecanique", 
        icon: "⚙️",
        desc: "Mouvement, forces, énergie mécanique<br>12 QCM (MRUA, forces, énergie cinétique/potentielle)",
        qcmCount: 12
    },
    { 
        nom: "Électrons-Atomes", 
        dossier: "Electrons-Atomes", 
        icon: "⚛️",
        desc: "Modèle quantique, configuration électronique<br>7 QCM interactifs sur les électrons et atomes",
        qcmCount: 7
    }
];

const container = document.getElementById("matieres");

chapitres.forEach(chapitre => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
        <h2>${chapitre.icon} ${chapitre.nom}</h2>
        <p>${chapitre.desc}</p>
        <div class="card-badge">${chapitre.qcmCount} QCM interactifs</div>
        <button class="launch-btn" onclick="lancerQCM('${chapitre.dossier}')">
            🚀 Lancer les QCM
        </button>
    `;
    container.appendChild(div);
});

function lancerQCM(dossier) {
    window.open(`${dossier}/index.html`, "_blank");
    
    const btn = event.target;
    btn.style.transform = "scale(0.95)";
    setTimeout(() => {
        btn.style.transform = "scale(1)";
    }, 150);
}

window.addEventListener('load', () => {
    const cards = document.querySelectorAll('.card');
    cards.forEach((card, index) => {
        card.style.opacity = '0';
        card.style.transform = 'translateY(30px)';
        setTimeout(() => {
            card.style.transition = 'all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            card.style.opacity = '1';
            card.style.transform = 'translateY(0)';
        }, index * 100);
    });
});
</script>

</body>
</html>
