        }

        function showQuestion() {
            const quiz = quizzes[currentQuiz];
            const q = quiz[currentQuestion];
            let html = `<div class="question">
                <h3>Q${currentQuestion + 1}/15: ${q.q}</h3>`;
            q.a.forEach((option, i) => {
                const checked = answers[currentQuestion] === i ? 'checked' : '';
                html += `<label><input type="radio" name="q${currentQuestion}" value="${i}" ${checked} onchange="selectAnswer(${currentQuestion}, ${i})"> ${option}</label>`;
            });
            html += '</div>';
            document.getElementById('quizContent').innerHTML = html;
            updateProgress();
            updateButtons();
        }

        function selectAnswer(qIdx, choice) {
            answers[qIdx] = choice;
            updateProgress();
        }

        function nextQuestion() {
            if (currentQuestion < 14) {
                currentQuestion++;
                showQuestion();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                showQuestion();
            }
        }

        function updateButtons() {
            document.getElementById('prevBtn').disabled = currentQuestion === 0;
            document.getElementById('nextBtn').disabled = currentQuestion === 14 && answers === null;[3]
            document.getElementById('finishBtn').disabled = answers.some(a => a === null);
        }

        function updateProgress() {
            const answered = answers.filter(a => a !== null).length;
            document.getElementById('progressBar').style.width = `${(answered / 15) * 100}%`;
        }

        function finishQuiz() {

            document.getElementById('score').innerHTML = `Score: ${score}/15 (${Math.round(score/15*100)}%)`;

        function changeQuiz() {
