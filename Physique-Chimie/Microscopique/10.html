<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>QCM – Conversions & Ordres de grandeur (Chimie 2nde)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:system-ui;background:#0f172a;color:#e5e7eb;margin:0}
header{padding:1rem;text-align:center;background:#020617}
.container{max-width:800px;margin:auto;padding:1rem}
.card{background:#1e293b;border-radius:14px;padding:1rem;box-shadow:0 10px 20px rgba(0,0,0,.3)}
.answers label{display:block;background:#0b1220;margin:.4rem 0;padding:.6rem;border-radius:10px;cursor:pointer}
.answers label.good{background:#14532d}
.answers label.bad{background:#7f1d1d}
.nav{display:flex;gap:.5rem;margin-top:1rem}
.nav button{flex:1;padding:.7rem;border:none;border-radius:10px;background:#38bdf8;color:#020617;font-weight:700}
.end{background:#22c55e}
.progress{color:#94a3b8;margin-bottom:.4rem}
.feedback{font-weight:700;margin-top:.4rem}
.hidden{display:none}
.result{background:#020617;padding:1rem;border-radius:12px;margin-top:1rem}
</style>
</head>
<body>
<header>
  <h1>QCM – Conversions & Ordres de grandeur</h1>
  <p>Chimie 2nde</p>
</header>

<div class="container">
  <div class="card">
    <div id="progress" class="progress"></div>
    <h2 id="question"></h2>
    <div id="answers" class="answers"></div>
    <div id="feedback" class="feedback"></div>
    <div class="nav">
      <button onclick="prev()">Précédent</button>
      <button onclick="next()">Suivant</button>
      <button class="end" onclick="finish()">Terminer</button>
    </div>
    <div id="result" class="result hidden"></div>
  </div>
</div>

<script>
const Q = [
{q:"1 nm en mètres vaut :", a:["10⁻¹² m","10⁻⁹ m","10⁻⁶ m","10⁻³ m"], c:1, e:"Le nanomètre vaut 10⁻⁹ m."},
{q:"0,1 nm correspond à :", a:["10⁻¹¹ m","10⁻¹⁰ m","10⁻⁹ m","10⁻¹² m"], c:1, e:"0,1 nm = 1×10⁻¹⁰ m (taille typique d’un atome)."},
{q:"1 µm en mètres :", a:["10⁻³","10⁻⁶","10⁻⁹","10⁻¹²"], c:1, e:"Le micron vaut 10⁻⁶ m."},
{q:"Le rayon d’un noyau est de l’ordre de :", a:["10⁻¹⁰ m","10⁻⁶ m","10⁻¹² à 10⁻¹⁵ m","10⁻³ m"], c:2, e:"Un noyau est de l’ordre du pm à fm."},
{q:"Une bactérie (~1 µm) vaut en mètres :", a:["10⁻⁹","10⁻⁶","10⁻³","1"], c:1, e:"1 µm = 10⁻⁶ m."},
{q:"10 cm en mètres :", a:["1 m","0,1 m","0,01 m","10 m"], c:1, e:"10 cm = 1 dm = 0,1 m."},
{q:"1 km en mètres :", a:["10²","10³","10⁴","10⁵"], c:1, e:"1 km = 1000 m = 10³ m."},
{q:"Un atome mesure typiquement :", a:["1 m","1 cm","0,1 nm","1 µm"], c:2, e:"Un atome est ~10⁻¹⁰ m."},
{q:"1000 nm en µm :", a:["0,001","0,1","1","10"], c:2, e:"1000 nm = 1 µm."},
{q:"1 pm en mètres :", a:["10⁻¹²","10⁻⁹","10⁻⁶","10⁻³"], c:0, e:"Le picomètre vaut 10⁻¹² m."},
{q:"Ordre de grandeur d’un atome :", a:["10⁻¹⁵ m","10⁻¹² m","10⁻¹⁰ m","10⁻⁶ m"], c:2, e:"Atome ~10⁻¹⁰ m."},
{q:"Entre atome (10⁻¹⁰ m) et noyau (10⁻¹⁵ m), le facteur est :", a:["10²","10³","10⁵","10¹⁰"], c:2, e:"10⁻¹⁰ / 10⁻¹⁵ = 10⁵."},
{q:"5 mm en mètres :", a:["0,5 m","0,05 m","0,005 m","5 m"], c:2, e:"5 mm = 5×10⁻³ m."},
{q:"2 dm en cm :", a:["2","20","200","0,2"], c:1, e:"1 dm = 10 cm."},
{q:"Une molécule est plutôt de l’ordre de :", a:["nm","µm","cm","m"], c:0, e:"Les molécules sont de l’ordre du nanomètre."}
];

let i=0, ans=Array(Q.length).fill(null);

function render(){
  const q=Q[i];
  progress.textContent=`Question ${i+1}/${Q.length}`;
  question.textContent=q.q;
  answers.innerHTML=""; feedback.textContent="";
  q.a.forEach((t,k)=>{
    const l=document.createElement("label");
    l.innerHTML=`<input type="radio" name="r"> ${t}`;
    l.onclick=()=>select(k,l);
    if(ans[i]!=null){
      if(k===q.c) l.classList.add("good");
      else if(k===ans[i]) l.classList.add("bad");
    }
    answers.appendChild(l);
  });
}

function select(k){
  ans[i]=k; render();
  feedback.textContent = (k===Q[i].c ? "✔ " : "✘ ") + Q[i].e;
}
function next(){ if(i<Q.length-1){i++;render();}}
function prev(){ if(i>0){i--;render();}}
function finish(){
  let s=0; Q.forEach((x,j)=>{if(ans[j]===x.c)s++;});
  result.classList.remove("hidden");
  result.innerHTML=`Score : <b>${s}/${Q.length}</b><hr>`+
  Q.map((x,j)=>`<b>Q${j+1}</b> ${x.q}<br>✔ ${x.a[x.c]}<br>🧠 ${x.e}<br><br>`).join("");
}

render();
</script>
</body>
</html>
