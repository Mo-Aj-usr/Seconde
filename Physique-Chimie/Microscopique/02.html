<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QCM Chimie 2nde - Atomes & Molécules</title>
  <style>
    :root {
      --primary: #2563eb;
      --success: #16a34a;
      --danger: #dc2626;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 1rem; line-height: 1.5; }
    .container { max-width: 1100px; margin: auto; }
    .main-content {
      background: white;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    .question-header { margin-bottom: 1.5rem; }
    .question-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.5rem; }
    .options { display: flex; flex-direction: column; gap: 1rem; margin: 1.5rem 0; }
    .option {
      padding: 1.2rem 1.5rem;
      border: 2px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .option:hover { border-color: var(--primary); background: #f0f7ff; }
    .option.selected { border-color: var(--primary); background: #eff6ff; }
    .option.correct { border-color: var(--success); background: #f0fdf4; }
    .option.incorrect { border-color: var(--danger); background: #fef2f2; }
    .feedback {
      margin-top: 1.5rem;
      padding: 1.2rem;
      background: #f8fafc;
      border-left: 5px solid var(--success);
      border-radius: 8px;
      display: none;
    }
    .feedback.show { display: block; }
    .controls {
      display: flex;
      gap: 1rem;
      justify-content: space-between;
      margin-top: 2rem;
    }
    .btn {
      padding: 0.9rem 1.8rem;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: #e2e8f0; color: var(--text); }
    .results { text-align: center; padding: 3rem 1rem; display: none; }
  </style>
</head>
<body>

<div class="container">
  <div class="main-content">
    <div class="question-header">
      <div class="question-title" id="question-title"></div>
      <div id="question-count"></div>
    </div>

    <div class="options" id="options"></div>

    <div class="feedback" id="feedback">
      <strong id="feedback-header"></strong>
      <div id="feedback-explanation"></div>
    </div>

    <div class="controls">
      <button class="btn btn-secondary" id="prev-btn">← Précédent</button>
      <button class="btn btn-primary" id="next-btn">Suivant →</button>
      <button class="btn btn-primary" id="finish-btn" style="display:none;">Terminer</button>
    </div>
  </div>

  <div class="results" id="results">
    <h2>Votre score : <span id="final-score"></span>/10</h2>
    <p id="score-message"></p>
    <button class="btn btn-primary" onclick="location.reload()">Recommencer</button>
  </div>
</div>

<script>
const quizData = [
  { q: "Le noyau contient :", opts: ["Seulement protons", "Protons + neutrons", "Protons + neutrons + électrons"], correct: 1, exp: "Le noyau = protons + neutrons. Électrons autour." },
  { q: "Atome neutre → charge :", opts: ["Positive", "Nulle", "Négative"], correct: 1, exp: "Protons = électrons → charge nulle." },
  { q: "Masse atome principalement dans :", opts: ["Électrons", "Noyau", "Nuage électronique"], correct: 1, exp: "Masse concentrée dans le noyau." },
  { q: "Numéro atomique Z = ", opts: ["Neutrons", "Protons", "Nucléons"], correct: 1, exp: "Z = nombre de protons." },
  { q: "Configuration Na (Z=11) :", opts: ["2,8,1", "2,8,2", "2,7,2"], correct: 0, exp: "2 (K) + 8 (L) + 1 (M) = 2,8,1" },
  // ... ajoutez les 5 autres questions si vous voulez les 10
  { q: "Cation Na⁺ a perdu :", opts: ["Proton", "Électron", "Neutron"], correct: 1, exp: "Perte d’un électron → charge +1" },
  { q: "Électroneutralité signifie :", opts: ["Z=A", "Somme charges = 0", "n_e = n_p"], correct: 1, exp: "Charges positives = charges négatives" },
  { q: "Liaison dans H₂O :", opts: ["Ionique", "Covalente polaire", "Métallique"], correct: 1, exp: "Covalente polaire (O plus électronégatif)" },
  { q: "Nombre d'Avogadro =", opts: ["6,02×10²³", "6,02×10²⁰", "22,4"], correct: 0, exp: "N_A = 6,02×10²³ entités/mol" },
  { q: "Espèce chimique = ", opts: ["Un seul atome", "Très grand nombre d'entités identiques", "Mélange"], correct: 1, exp: "Définition Eduscol : collection d'entités identiques" }
];

let current = 0;
let answers = new Array(quizData.length).fill(null);

const els = {
  title: document.getElementById('question-title'),
  count: document.getElementById('question-count'),
  options: document.getElementById('options'),
  feedback: document.getElementById('feedback'),
  fbHeader: document.getElementById('feedback-header'),
  fbExp: document.getElementById('feedback-explanation'),
  prev: document.getElementById('prev-btn'),
  next: document.getElementById('next-btn'),
  finish: document.getElementById('finish-btn'),
  results: document.getElementById('results'),
  score: document.getElementById('final-score'),
  msg: document.getElementById('score-message')
};

function loadQuestion() {
  const q = quizData[current];
  els.title.textContent = q.q;
  els.count.textContent = `Question ${current+1} / ${quizData.length}`;

  els.options.innerHTML = q.opts.map((text, i) => `
    <div class="option" onclick="select(${i})">
      ${String.fromCharCode(65+i)}. ${text}
    </div>
  `).join('');

  els.feedback.classList.remove('show');
  updateButtons();
}

function select(idx) {
  if (answers[current] !== null) return; // déjà répondu

  answers[current] = idx;
  const q = quizData[current];
  const correct = q.correct;

  document.querySelectorAll('.option').forEach((opt, i) => {
    opt.onclick = null;
    if (i === correct) opt.classList.add('correct');
    if (i === idx) {
      opt.classList.add('selected');
      if (i !== correct) opt.classList.add('incorrect');
    }
  });

  els.fbHeader.innerHTML = idx === correct ? "✅ Bonne réponse !" : "❌ Dommage...";
  els.fbExp.textContent = q.exp;
  els.feedback.classList.add('show');

  updateButtons();
}

function updateButtons() {
  els.prev.disabled = current === 0;
  els.next.disabled = answers[current] === null;               // ← clé : actif seulement après réponse
  els.finish.style.display = (current === quizData.length - 1 && answers[current] !== null) ? 'inline-block' : 'none';
  els.next.style.display = current === quizData.length - 1 ? 'none' : 'inline-block';
}

function prev() {
  if (current > 0) {
    current--;
    loadQuestion();
  }
}

function next() {
  if (current < quizData.length - 1 && answers[current] !== null) {
    current++;
    loadQuestion();
  }
}

function showResults() {
  const score = answers.reduce((sum, ans, i) => sum + (ans === quizData[i].correct ? 1 : 0), 0);
  els.score.textContent = score;
  els.msg.textContent = score >= 8 ? "Très bon niveau !" : score >= 5 ? "Bon travail, continue !" : "À revoir les bases.";
  document.querySelector('.main-content').style.display = 'none';
  els.results.style.display = 'block';
}

els.prev.onclick = prev;
els.next.onclick = next;
els.finish.onclick = showResults;

loadQuestion();
  </script>
</body>
</html>
