<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>QCM Chimie 2nde – Atomes & Électrons</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:system-ui;background:#0f172a;color:#e5e7eb;margin:0}
header{padding:1rem;text-align:center;background:#020617}
h1{margin:.2rem;font-size:1.6rem}
.container{max-width:900px;margin:auto;padding:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
.card{background:#1e293b;border-radius:14px;padding:1rem;box-shadow:0 10px 20px rgba(0,0,0,.3)}
.card button{width:100%;padding:.7rem;border:none;border-radius:10px;background:#38bdf8;color:#020617;font-weight:700}
.quiz{display:none}
.progress{margin:.5rem 0;color:#94a3b8}
.answers label{display:block;background:#0b1220;margin:.4rem 0;padding:.6rem;border-radius:10px;cursor:pointer}
.answers label.good{background:#14532d}
.answers label.bad{background:#7f1d1d}
.nav{display:flex;gap:.5rem;margin-top:1rem}
.nav button{flex:1;padding:.7rem;border:none;border-radius:10px;background:#38bdf8;color:#020617;font-weight:700}
.nav .end{background:#22c55e}
.hidden{display:none}
.feedback{margin-top:.5rem;font-weight:700}
.result{background:#020617;padding:1rem;border-radius:12px;margin-top:1rem}
</style>
</head>
<body>

<header>
  <h1>Chimie 2nde – QCM Atomes & Électrons</h1>
  <p>Programme officiel – Physique-Chimie voie GT</p>
</header>

<div class="container">

<div id="dashboard" class="grid"></div>

<div id="quiz" class="quiz card">
  <div class="progress" id="progress"></div>
  <h2 id="question"></h2>
  <div class="answers" id="answers"></div>
  <div id="feedback" class="feedback"></div>
  <div class="nav">
    <button onclick="prev()">Précédent</button>
    <button onclick="next()">Suivant</button>
    <button class="end" onclick="finish()">Terminer</button>
  </div>
  <div id="result" class="result hidden"></div>
</div>

</div>

<script>
const quizzes = [
{
title:"QCM 1 – Structure atomique",
q:[
{q:"La notation ¹⁶₈O indique :",a:["8 protons et 8 neutrons","16 protons","8 neutrons seulement","16 électrons"],c:0,e:"Z=8 ⇒ 8 protons. A=16 ⇒ 16 nucléons, donc 8 neutrons."},
{q:"Le numéro atomique Z correspond au nombre de :",a:["neutrons","protons","nucléons","électrons libres"],c:1,e:"Z est défini comme le nombre de protons du noyau."},
{q:"Un isotope se distingue par :",a:["Z différent","même masse","nombre de neutrons différent","charge différente"],c:2,e:"Les isotopes ont le même Z mais un nombre de neutrons différent."},
{q:"Le noyau est :",a:["chargé négativement","neutre","chargé positivement","sans masse"],c:2,e:"Le noyau contient des protons (+) et des neutrons (0)."},
{q:"Le proton porte :",a:["+e","-e","0","2e"],c:0,e:"La charge élémentaire du proton vaut +e."},
{q:"Ordre de grandeur du rayon atomique :",a:["10⁻¹⁵ m","10⁻¹² m","10⁻¹⁰ m","10⁻⁶ m"],c:2,e:"La taille d’un atome est de l’ordre de 10⁻¹⁰ m."},
{q:"Ordre de grandeur du noyau :",a:["10⁻¹⁰ m","10⁻¹⁵ m","10⁻⁶ m","10⁻³ m"],c:1,e:"Le noyau est 100 000 fois plus petit que l’atome."},
{q:"Le cortège électronique est :",a:["le noyau","l'ensemble des électrons","les protons","les neutrons"],c:1,e:"Il regroupe tous les électrons autour du noyau."},
{q:"Masse de l’atome dominée par :",a:["les électrons","le noyau","les ions","les couches"],c:1,e:"La masse des électrons est négligeable devant celle du noyau."},
{q:"Le neutron est :",a:["chargé +","chargé -","neutre","instable"],c:2,e:"Le neutron ne porte pas de charge électrique."},
{q:"Le modèle de Bohr décrit :",a:["le noyau","les couches électroniques","les molécules","les ions"],c:1,e:"Bohr modélise les électrons par couches autour du noyau."},
{q:"Un atome neutre a :",a:["plus de protons","plus d’électrons","autant de protons que d’électrons","aucun électron"],c:2,e:"Neutralité électrique ⇒ charges + et – se compensent."},
{q:"La charge du noyau vaut :",a:["+Ze","-Ze","0","e"],c:0,e:"Z protons ⇒ charge totale +Ze."},
{q:"La masse du noyau d’oxygène ≈ :",a:["8 u","16 u","24 u","32 u"],c:1,e:"Le nombre de masse A vaut 16."},
{q:"La structure atomique décrit :",a:["liaisons","composition du noyau","réactions","gaz nobles"],c:1,e:"Elle concerne protons, neutrons et électrons."}
]}
];

const dash=document.getElementById("dashboard");
quizzes.forEach((q,i)=>{
  const d=document.createElement("div");
  d.className="card";
  d.innerHTML=`<h3>${q.title}</h3><button onclick="start(${i})">Commencer</button>`;
  dash.appendChild(d);
});

let qi=0,ci=0,answers=[];
function start(i){
  qi=i;ci=0;answers=Array(quizzes[qi].q.length).fill(null);
  dash.style.display="none";
  document.getElementById("quiz").style.display="block";
  render();
}

function render(){
  const Q=quizzes[qi].q[ci];
  document.getElementById("progress").textContent=`Question ${ci+1}/15`;
  document.getElementById("question").textContent=Q.q;
  const a=document.getElementById("answers");
  const f=document.getElementById("feedback");
  a.innerHTML=""; f.textContent="";
  Q.a.forEach((t,i)=>{
    const l=document.createElement("label");
    l.innerHTML=`<input type="radio" name="r"> ${t}`;
    l.onclick=()=>select(i,l);
    if(answers[ci]!=null){
      if(i==Q.c) l.classList.add("good");
      else if(i==answers[ci]) l.classList.add("bad");
    }
    a.appendChild(l);
  });
}

function select(i,label){
  const Q=quizzes[qi].q[ci];
  answers[ci]=i;
  render();
  const f=document.getElementById("feedback");
  if(i==Q.c) f.textContent="✔ Bonne réponse — "+Q.e;
  else f.textContent="✘ Mauvaise réponse — "+Q.e;
}

function next(){ if(ci<14){ci++;render();}}
function prev(){ if(ci>0){ci--;render();}}

function finish(){
  let s=0;
  const Q=quizzes[qi].q;
  Q.forEach((x,i)=>{if(answers[i]==x.c)s++;});
  const r=document.getElementById("result");
  r.classList.remove("hidden");
  r.innerHTML=`Score : <b>${s}/15</b><hr>`+
  Q.map((x,i)=>`<b>Q${i+1}</b> ${x.q}<br>
  ✔ ${x.a[x.c]}<br>
  🧠 ${x.e}<br><br>`).join("");
}
</script>
</body>
</html>
