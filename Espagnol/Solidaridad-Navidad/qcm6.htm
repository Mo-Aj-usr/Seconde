<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Vocabulaire Espagnol A2 – 200 mots fréquents</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    min-height: 100vh;
    padding: 20px;
}

.container { max-width: 1000px; margin: auto; }

.header {
    text-align: center;
    color: white;
    margin-bottom: 30px;
    font-size: 2.2em;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
}

.quiz-container {
    background: white;
    border-radius: 25px;
    padding: 35px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.25);
}

.progress-container {
    background: #f0f3ff;
    height: 12px;
    border-radius: 12px;
    margin-bottom: 25px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb);
    width: 0%;
    transition: width 0.5s ease;
}

.question h3 {
    background: linear-gradient(45deg, #6c5ce7, #00cec9);
    color: white;
    padding: 20px;
    border-radius: 18px;
    margin-bottom: 25px;
}

.options { display: grid; gap: 15px; }

.option {
    padding: 18px 25px;
    border: 3px solid #e3f2fd;
    border-radius: 15px;
    cursor: pointer;
    background: #f8fcff;
    transition: all 0.3s ease;
}

.option:hover {
    transform: translateY(-3px);
    border-color: #4facfe;
}

.option.selected { background: #dfe6fd; }

.option.correct {
    background: linear-gradient(45deg, #56ab2f, #a8e6cf);
    color: white;
    border-color: #56ab2f;
}

.option.incorrect {
    background: linear-gradient(45deg, #ff4757, #ff6b81);
    color: white;
    border-color: #ff4757;
}

.feedback {
    margin-top: 20px;
    padding: 18px;
    border-radius: 12px;
    font-weight: bold;
    display: none;
}

.feedback.correct {
    background: #d4edda;
    color: #155724;
    border: 2px solid #28a745;
}

.feedback.incorrect {
    background: #f8d7da;
    color: #721c24;
    border: 2px solid #dc3545;
}

.nav-buttons {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-top: 30px;
}

.btn {
    padding: 15px 30px;
    border: none;
    border-radius: 25px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    color: white;
}

.btn-prev { background: #6c5ce7; }
.btn-next { background: #00b894; }
.btn-finish { background: #fdcb6e; color: #2d3436; }

.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.results {
    display: none;
    text-align: center;
    background: white;
    padding: 50px;
    border-radius: 25px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.25);
}

.score {
    font-size: 48px;
    color: #2d3436;
    margin: 20px 0;
}

.restart-btn {
    background: #ff6b6b;
    color: white;
    padding: 18px 40px;
    border-radius: 30px;
    border: none;
    font-size: 18px;
    cursor: pointer;
}
</style>
</head>

<body>
<div class="container">
<h1 class="header">🎯 Quiz Vocabulaire Espagnol A2<br>
<span style="font-size:0.5em;font-weight:normal;">200 mots fréquents – Seconde LV2</span>
</h1>

<div id="quiz-container" class="quiz-container">
    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div id="question-container"></div>

    <div class="nav-buttons">
        <button class="btn btn-prev" id="prev-btn" onclick="prevQuestion()">⬅️ Précédent</button>
        <button class="btn btn-next" id="next-btn" onclick="nextQuestion()">Suivant ➡️</button>
        <button class="btn btn-finish" onclick="finishQuiz()">✅ Terminer</button>
    </div>
</div>

<div id="results-container" class="results"></div>
</div>

<script>
const quizData = [
{q:"¿Cuál es el saludo del día?", o:["Hola","Adiós","Buenos días","Buenas noches"], c:2, e:"«Buenos días» se usa por la mañana."},
{q:"La familia vive en una…", o:["casa","escuela","oficina","tienda"], c:0, e:"Casa = maison."},
{q:"¿Qué hora es? Son las…", o:["ocho","ochenta","ochocientos","ocho mil"], c:0, e:"Ocho = huit."},
{q:"Yo … en el restaurante.", o:["como","bebo","leo","veo"], c:0, e:"Comer = manger."},
{q:"Mi madre es…", o:["grande","rápida","fría","difícil"], c:0, e:"Grande = grande."},
{q:"¿Dónde está el libro?", o:["encima de la mesa","debajo mesa","dentro mesa","encima libro"], c:0, e:"Encima de = sur."},
{q:"Tengo … hermanos.", o:["dos","veinte","doscientos","mil"], c:0, e:"Dos = deux."},
{q:"Ella … cansada.", o:["está","tiene","va","hace"], c:0, e:"Estar = état."},
{q:"Vamos al … a comprar pan.", o:["supermercado","hospital","cine","escuela"], c:0, e:"Supermercado = supermarché."},
{q:"¿Cómo te llamas?", o:["Tengo 15 años","Me llamo Ana","Vivo aquí","Soy alto"], c:1, e:"Me llamo = je m'appelle."}
];

let index = 0;
let answers = Array(quizData.length).fill(null);

function loadQuestion() {
    const q = quizData[index];
    const container = document.getElementById("question-container");
    container.innerHTML = `
    <div class="question">
        <h3>❓ Pregunta ${index+1} / ${quizData.length}<br>${q.q}</h3>
        <div class="options">
            ${q.o.map((op,i)=>`<div class="option" onclick="selectOption(${i})">${op}</div>`).join("")}
        </div>
        <div class="feedback" id="feedback"></div>
    </div>`;
    updateProgress();
    restoreState();
}

function selectOption(i){
    if(answers[index]!==null) return;
    answers[index]=i;
    const q=quizData[index];
    const opts=document.querySelectorAll(".option");
    const fb=document.getElementById("feedback");
    opts.forEach((o,j)=>{
        if(j===q.c) o.classList.add("correct");
        if(j===i && i!==q.c) o.classList.add("incorrect");
    });
    fb.textContent=(i===q.c?"✔️ Correcto. ":"❌ Incorrecto. ")+q.e;
    fb.className="feedback "+(i===q.c?"correct":"incorrect");
    fb.style.display="block";
}

function restoreState(){
    if(answers[index]===null) return;
    selectOption(answers[index]);
}

function nextQuestion(){ if(index<quizData.length-1){ index++; loadQuestion(); }}
function prevQuestion(){ if(index>0){ index--; loadQuestion(); }}

function updateProgress(){
    document.getElementById("progress-bar").style.width =
    ((index+1)/quizData.length*100)+"%";
}

function finishQuiz(){
    const score=answers.filter((a,i)=>a===quizData[i].c).length;
    document.getElementById("quiz-container").style.display="none";
    document.getElementById("results-container").innerHTML=`
    <h2>📊 Résultat final</h2>
    <div class="score">${score} / ${quizData.length}</div>
    <p>${score>=8?"Excelente 🎉":score>=5?"Buen trabajo 🙂":"A repasar 📘"}</p>
    <button class="restart-btn" onclick="location.reload()">🔄 Recommencer</button>`;
    document.getElementById("results-container").style.display="block";
}

loadQuestion();
</script>
</body>
</html>
