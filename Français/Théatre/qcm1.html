<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>QCM 1 – Théâtre (Bases)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #f97316;
      --text: #f9fafb;
      --text-muted: #d1d5db;
      --success: #22c55e;
      --error: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #020617 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      max-width: 800px;
      width: 100%;
      background: rgba(17, 24, 39, 0.95);
      border-radius: 20px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, var(--accent), #ea580c);
      padding: 20px;
      text-align: center;
    }

    .title {
      font-size: 1.4rem;
      font-weight: 700;
      margin: 0;
      color: white;
    }

    .subtitle {
      color: rgba(255,255,255,0.9);
      margin: 5px 0 0 0;
      font-size: 0.95rem;
    }

    .question-section {
      padding: 25px;
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .question-num {
      font-weight: 600;
      color: var(--text);
      font-size: 1.1rem;
    }

    .progress-bar {
      flex: 1;
      height: 6px;
      background: rgba(148, 163, 184, 0.2);
      border-radius: 3px;
      margin-left: 15px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #fb923c);
      width: 0%;
      transition: width 0.3s ease;
    }

    .question-text {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 25px;
      color: var(--text);
    }

    .answers {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .answer-btn {
      padding: 15px 18px;
      border: 2px solid rgba(148, 163, 184, 0.4);
      background: var(--card-bg);
      color: var(--text) !important;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 1rem;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      text-align: left;
    }

    .answer-btn:hover {
      border-color: rgba(249, 115, 22, 0.6);
      background: rgba(249, 115, 22, 0.1);
      transform: translateY(-1px);
    }

    .answer-btn.selected {
      border-color: var(--accent);
      background: rgba(249, 115, 22, 0.15);
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1);
    }

    .answer-radio {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(148, 163, 184, 0.6);
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 2px;
      position: relative;
      transition: all 0.2s ease;
    }

    .answer-btn.selected .answer-radio {
      border-color: var(--accent);
      background: rgba(249, 115, 22, 0.2);
    }

    .answer-btn.selected .answer-radio::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      width: 10px;
      height: 10px;
      background: var(--accent);
      border-radius: 50%;
    }

    .nav-buttons {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(148, 163, 184, 0.2);
    }

    .btn {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: rgba(148, 163, 184, 0.2);
      color: var(--text);
      border: 1px solid rgba(148, 163, 184, 0.4);
    }

    .btn-secondary:hover:not(:disabled) {
      background: rgba(148, 163, 184, 0.3);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #ea580c);
      color: white;
      font-weight: 700;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 10px 25px rgba(249, 115, 22, 0.4);
    }

    .results {
      display: none;
      padding: 25px;
      text-align: center;
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.1), rgba(16, 185, 129, 0.1));
      border-top: 1px solid rgba(34, 197, 94, 0.3);
    }

    .results.show {
      display: block;
    }

    .score {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--success);
      margin-bottom: 10px;
    }

    .score-text {
      font-size: 1.2rem;
      color: var(--text);
      margin-bottom: 20px;
    }

    @media (max-width: 600px) {
      body { padding: 15px; }
      .question-section { padding: 20px 15px; }
      .nav-buttons { flex-direction: column; }
      .btn { min-height: 50px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="title">QCM 1 – Bases Théâtre</h1>
      <p class="subtitle">Théâtre français (XVIIe-XXIe siècles) - Lycée</p>
    </div>

    <div class="question-section">
      <div class="question-header">
        <div class="question-num" id="questionNum">Question 1/10</div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="question-text" id="questionText"></div>

      <div class="answers" id="answers"></div>

      <div class="nav-buttons">
        <button class="btn btn-secondary" id="prevBtn">◀ Précédent</button>
        <button class="btn btn-primary" id="nextBtn">Suivant ▶</button>
        <button class="btn btn-primary" id="finishBtn">Terminer ✓</button>
      </div>
    </div>

    <div class="results" id="results">
      <div class="score" id="finalScore">0/10</div>
      <div class="score-text" id="scoreText"></div>
      <button class="btn btn-secondary" onclick="location.reload()">Refaire</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        text: "La règle des trois unités (temps, lieu, action) appartient au théâtre :",
        choices: ["Romantique", "Classique", "Absurde", "Réaliste"],
        correct: 1
      },
      {
        text: "Dans le théâtre classique, le vers dominant est :",
        choices: ["L'octosyllabe", "L'alexandrin", "Le décasyllabe", "Le tétramètre"],
        correct: 1
      },
      {
        text: "Molière écrit principalement des :",
        choices: ["Tragédies", "Comédies", "Tragicomédies", "Pièces historiques"],
        correct: 1
      },
      {
        text: "Le théâtre de l'absurde est illustré par :",
        choices: ["Racine", "Beckett", "Corneille", "Marivaux"],
        correct: 1
      },
      {
        text: "Dans « Le Cid » de Corneille, le conflit principal est :",
        choices: ["Amour vs Devoir", "Richesse vs Pauvreté", "Religion vs État", "Jeunesse vs Vieillesse"],
        correct: 0
      },
      {
        text: "La catharsis aristotélicienne désigne :",
        choices: ["La purification des passions", "La comédie", "Le décor réaliste", "Les trois unités"],
        correct: 0
      },
      {
        text: "Racine excelle dans le genre de la :",
        choices: ["Comédie", "Tragédie", "Farce", "Drame bourgeois"],
        correct: 1
      },
      {
        text: "Le rideau de scène apparaît au théâtre au :",
        choices: ["XVIe siècle", "XVIIe siècle", "XVIIIe siècle", "XIXe siècle"],
        correct: 2
      },
      {
        text: "Le théâtre romantique rejette les règles du théâtre :",
        choices: ["Grec", "Classique", "Élisabéthain", "Moderne"],
        correct: 1
      },
      {
        text: "Dans « En attendant Godot », les personnages principaux sont :",
        choices: ["Hamlet et Ophélie", "Vladimir et Estragon", "Tartuffe et Elmire", "Phèdre et Hippolyte"],
        correct: 1
      }
    ];

    let currentQuestion = 0;
    let answers = new Array(questions.length).fill(null);
    let quizFinished = false;

    const elements = {
      questionNum: document.getElementById('questionNum'),
      questionText: document.getElementById('questionText'),
      answers: document.getElementById('answers'),
      progressFill: document.getElementById('progressFill'),
      prevBtn: document.getElementById('prevBtn'),
      nextBtn: document.getElementById('nextBtn'),
      finishBtn: document.getElementById('finishBtn'),
      results: document.getElementById('results'),
      finalScore: document.getElementById('finalScore'),
      scoreText: document.getElementById('scoreText')
    };

    function renderQuestion() {
      const q = questions[currentQuestion];
      elements.questionNum.textContent = `Question ${currentQuestion + 1}/10`;
      elements.questionText.textContent = q.text;
      elements.progressFill.style.width = `${((currentQuestion + 1) / 10) * 100}%`;

      elements.answers.innerHTML = '';
      q.choices.forEach((choice, index) => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn' + (answers[currentQuestion] === index ? ' selected' : '');
        btn.innerHTML = `<div class="answer-radio"></div><span>${choice}</span>`;
        btn.onclick = () => selectAnswer(index);
        elements.answers.appendChild(btn);
      });
      updateButtons();
    }

    function selectAnswer(index) {
      answers[currentQuestion] = index;
      renderQuestion();
    }

    function updateButtons() {
      elements.prevBtn.disabled = currentQuestion === 0;
      elements.nextBtn.disabled = currentQuestion === 9 || answers[currentQuestion] === null;
    }

    function calculateScore() {
      let score = 0;
      answers.forEach((answer, i) => {
        if (answer === questions[i].correct) score++;
      });
      return score;
    }

    function showResults() {
      const score = calculateScore();
      elements.finalScore.textContent = `${score}/10`;
      elements.scoreText.textContent = score >= 8 ? "Excellent !" : score >= 6 ? "Très bien !" : score >= 4 ? "Bon travail !" : "À réviser !";
      elements.results.classList.add('show');
      quizFinished = true;
    }

    elements.prevBtn.onclick = () => { if (currentQuestion > 0) { currentQuestion--; renderQuestion(); } };
    elements.nextBtn.onclick = () => { if (currentQuestion < 9 && answers[currentQuestion] !== null) { currentQuestion++; renderQuestion(); } };
    elements.finishBtn.onclick = () => { if (!quizFinished) showResults(); };

    renderQuestion();
  </script>
</body>
</html>
