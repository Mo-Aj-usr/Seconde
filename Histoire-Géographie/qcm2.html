<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>QCM - 20 événements majeurs décembre 2025</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --primary: #2563eb;
      --success: #059669;
      --danger: #dc2626;
      --warning: #d97706;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 1rem;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--primary), #1d4ed8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }

    .stat {
      text-align: center;
    }

    .stat-number {
      font-size: 2rem;
      font-weight: bold;
      color: var(--primary);
    }

    .quiz-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border: 1px solid var(--border);
    }

    .progress {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--border);
    }

    .progress-bar {
      flex: 1;
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      margin: 0 1rem;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--success));
      transition: width 0.3s ease;
      border-radius: 4px;
    }

    .question {
      margin-bottom: 1.5rem;
    }

    .question-number {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }

    .question-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      line-height: 1.4;
    }

    .question-context {
      color: var(--text-muted);
      font-style: italic;
      margin-bottom: 1.5rem;
      padding: 1rem;
      background: #f1f5f9;
      border-radius: 8px;
      border-left: 4px solid var(--primary);
    }

    .options {
      display: grid;
      gap: 1rem;
    }

    .option {
      padding: 1.25rem;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: white;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .option:hover:not(.selected):not(.answered) {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.15);
    }

    .option.selected {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .option.correct {
      border-color: var(--success);
      background: #ecfdf5;
    }

    .option.correct::after {
      content: '✓';
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--success);
      font-size: 1.5rem;
      font-weight: bold;
    }

    .option.incorrect {
      border-color: var(--danger);
      background: #fef2f2;
    }

    .option.answered {
      cursor: default;
      opacity: 0.7;
    }

    .option-letter {
      display: inline-flex;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      margin-right: 1rem;
      flex-shrink: 0;
    }

    .option-content {
      flex: 1;
    }

    .feedback {
      margin-top: 1.5rem;
      padding: 1.25rem;
      border-radius: 12px;
      font-weight: 500;
      display: none;
    }

    .feedback.success {
      background: #d1fae5;
      color: var(--success);
      border: 1px solid #a7f3d0;
      display: block;
    }

    .feedback.error {
      background: #fee2e2;
      color: var(--danger);
      border: 1px solid #fca5a5;
      display: block;
    }

    .navigation {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 2px solid var(--border);
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #1d4ed8);
      color: white;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4);
    }

    .btn-secondary {
      background: #f1f5f9;
      color: var(--text);
      border: 2px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background: #e2e8f0;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .results {
      display: none;
      text-align: center;
      margin-top: 2rem;
    }

    .results.show {
      display: block;
    }

    .score {
      font-size: 3rem;
      font-weight: bold;
      background: linear-gradient(135deg, var(--success), #10b981);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
    }

    .score-text {
      font-size: 1.2rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .category-breakdown {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-top: 2rem;
    }

    .category {
      background: white;
      padding: 1.5rem;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .category-score {
      font-size: 2rem;
      font-weight: bold;
    }

    .restart-btn {
      margin-top: 2rem;
      max-width: 300px;
      width: 100%;
    }

    @media (max-width: 768px) {
      .container {
        padding: 0 1rem;
      }
      
      .header {
        padding: 1.5rem;
      }
      
      h1 {
        font-size: 1.5rem;
      }
      
      .quiz-card {
        padding: 1.5rem;
      }
      
      .navigation {
        flex-direction: column;
        gap: 1rem;
      }
      
      .btn {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>🌍 Décembre 2025</h1>
      <p class="subtitle">QCM - 20 événements majeurs mondiaux</p>
      <div class="stats">
        <div class="stat">
          <div class="stat-number">20</div>
          <div>Questions</div>
        </div>
        <div class="stat">
          <div class="stat-number">4</div>
          <div>Domaines</div>
        </div>
        <div class="stat">
          <div class="stat-number">✅</div>
          <div>Score en direct</div>
        </div>
      </div>
    </header>

    <div class="quiz-card">
      <div class="progress">
        <span id="progressText">Question 1 / 20</span>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span id="scoreText">0 / 20</span>
      </div>

      <div class="question">
        <div class="question-number" id="questionNumber"></div>
        <div class="question-title" id="questionTitle"></div>
        <div class="question-context" id="questionContext"></div>
        <div class="options" id="options"></div>
        <div class="feedback" id="feedback"></div>
      </div>

      <div class="navigation">
        <button class="btn btn-secondary" id="prevBtn">← Précédent</button>
        <div>
          <button class="btn btn-secondary" id="nextBtn">Suivant →</button>
          <button class="btn btn-primary" id="showResultsBtn" style="display: none;">Voir les résultats</button>
        </div>
      </div>

      <div class="results" id="results">
        <div class="score" id="finalScore"></div>
        <div class="score-text" id="scoreMessage"></div>
        <div class="category-breakdown" id="categoryBreakdown"></div>
        <button class="btn btn-primary restart-btn" id="restartBtn">🔄 Recommencer le QCM</button>
      </div>
    </div>
  </div>

  <script>
    const questions = [
      {
        title: "Quel pays connaît un coup d’État militaire en décembre 2025 ?",

      {

        ],
        correct: 0,
        feedback: "Les forces séparatistes sudistes affaiblissent le gouvernement yéménite.",
        category: "geopolitics"
      },
      {
        title: "Où un général russe est-il assassiné dans un attentat à la voiture piégée ?",
        context: "🔴 Conflits, sécurité, géopolitique",
        options: [
          "Moscou",

          "Donetsk",
          "Saint-Pétersbourg"
        ],
        correct: 0,

        category: "geopolitics"
      },
      {
        title: "Où trois Gardiens de la révolution iraniens sont-ils tués dans une embuscade ?",
        context: "🔴 Conflits, sécurité, géopolitique",
        options: [
          "Sistan-et-Baloutchistan",
          "Téhéran",
          "Kermanshah",
          "Ahvaz"
        ],
        correct: 0,
        feedback: "Attaque dans la province instable du sud-est iranien.",
        category: "geopolitics"
      },
      {
        title: "En Bulgarie, quel Premier ministre démissionne après des manifestations ?",
        context: "🏛️ Politique et élections",
        options: [
          "Rosen Zhelyazkov",
          "Boyko Borissov",
          "Kiril Petkov",
          "Stefan Yanev"
        ],
        correct: 0,
        feedback: "Manifestations massives contre corruption et politique budgétaire.",
        category: "politics"
      },
      {
        title: "Quel parti conserve la majorité aux élections de Saint-Lucie ?",
        context: "🏛️ Politique et élections",
        options: [
          "Saint Lucia Labour Party",
          "United Workers Party",
          "Star Alliance",

        ],
        correct: 0,
        feedback: "Philip J. Pierre maintient une large majorité parlementaire.",
        category: "politics"
      },
      {
        title: "Qui redevient Premier ministre de République tchèque en décembre 2025 ?",
        context: "🏛️ Politique et élections",
        options: [
          "Andrej Babiš",

        ],
        correct: 0,

        category: "politics"
      },
      {
        title: "Quel pays connaît une crise post-électorale avec accusations de fraude ?",
        context: "🏛️ Politique et élections",
        options: [
          "Honduras",

        ],
        correct: 0,
        feedback: "Manifestations et appels à l'annulation du scrutin.",
        category: "politics"
      },
      {
        title: "Au Myanmar, qui organise des élections sous contrôle militaire ?",
        context: "🏛️ Politique et élections",
        options: [
          "Général Min Aung Hlaing",
          "Aung San Suu Kyi",
          "Win Myint",
          "Htin Kyaw"
        ],
        correct: 0,
        feedback: "Élections largement dénoncées comme non libres.",
        category: "politics"
      },
      {
        title: "Quel montant le FMI décaisse-t-il pour le Pakistan ?",
        context: "💰 Économie et décisions internationales",
        options: [
          "1,2 milliard $",
          "500 millions $",
          "2 milliards $",
          "800 millions $"
        ],
        correct: 0,
        feedback: "Dans le cadre d'un programme total de 3,3 milliards de dollars.",
        category: "economy"
      },
      {
        title: "Quel pays rejoint l'initiative européenne « Security Action for Europe » ?",
        context: "💰 Économie et décisions internationales",
        options: [
          "Canada",
          "Norvège",
          "Suisse",
          "Japon"
        ],
        correct: 0,
        feedback: "Renforcement de la coopération industrielle de défense avec l'UE.",
        category: "economy"
      },
      {
        title: "Quelle compagnie aérienne indienne subit une réduction de 5% de ses vols ?",
        context: "💰 Économie et décisions internationales",
        options: [
          "IndiGo",

          "SpiceJet",
          "Vistara"
        ],
        correct: 0,
        feedback: "Après une grave crise de planification causant des milliers d'annulations.",
        category: "economy"
      },
      {
        title: "Quelle institution américaine tient une réunion monétaire cruciale en décembre ?",
        context: "💰 Économie et décisions internationales",
        options: [
          "Réserve fédérale",
          "Trésor américain",
          "SEC",
          "Fannie Mae"
        ],
        correct: 0,
        feedback: "Attente d'une baisse des taux directeurs très suivie par les marchés.",
        category: "economy"
      },
      {
        title: "Quel nouvel aéroport majeur est inauguré près de Mumbai ?",
        context: "💰 Économie et décisions internationales",
        options: [
          "Navi Mumbai",
          "Pune",
          "Goa",
          "Ahmedabad"
        ],
        correct: 0,
        feedback: "Pour désengorger l'aéroport Chhatrapati-Shivaji de Mumbai.",
        category: "economy"
      },
      {
        title: "Quelle date célèbre la Journée internationale de lutte contre la corruption ?",
        context: "📅 Grandes dates internationales",
        options: [
          "9 décembre",
          "10 décembre",
          "15 décembre",
          "1er décembre"
        ],
        correct: 0,
        feedback: "Journée reconnue par l'ONU avec campagnes mondiales.",
        category: "calendar"
      },
      {
        title: "Quand débute Hanoucca 2025 ?",
        context: "📅 Grandes dates internationales",
        options: [
          "15 décembre",
          "8 décembre",
          "25 décembre",
          "1er décembre"
        ],
        correct: 0,
        feedback: "Fête juive des Lumières pendant huit jours.",
        category: "calendar"
      },
      {
        title: "Quelle journée internationale célèbre les droits des migrants ?",
        context: "📅 Grandes dates internationales",
        options: [
          "18 décembre",
          "20 juin",
          "5 juin",
          "12 août"
        ],
        correct: 0,
        feedback: "Dans un contexte de déplacements forcés record.",
        category: "calendar"
      },
      {
        title: "Quel jour marque le solstice d'hiver 2025 (hémisphère Nord) ?",
        context: "📅 Grandes dates internationales",
        options: [
          "21 décembre",
          "22 décembre",
          "20 décembre",
          "23 décembre"
        ],
        correct: 0,
        feedback: "Jour le plus court de l'année avec célébrations culturelles.",
        category: "calendar"
      },
      {
        title: "Où se tient la Coupe d'Afrique des Nations 2025 ?",
        context: "📅 Grandes dates internationales",
        options: [
          "Maroc",
          "Côte d'Ivoire",
          "Égypte",
          "Cameroun"
        ],
        correct: 0,
        feedback: "Début en décembre 2025, suivi jusqu'en janvier 2026.",
        category: "calendar"
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let answers = new Array(questions.length).fill(null);
    let quizCompleted = false;

    const elements = {
      questionNumber: document.getElementById('questionNumber'),
      questionTitle: document.getElementById('questionTitle'),
      questionContext: document.getElementById('questionContext'),
      options: document.getElementById('options'),
      feedback: document.getElementById('feedback'),
      progressText: document.getElementById('progressText'),
      progressFill: document.getElementById('progressFill'),
      scoreText: document.getElementById('scoreText'),
      prevBtn: document.getElementById('prevBtn'),
      nextBtn: document.getElementById('nextBtn'),
      showResultsBtn: document.getElementById('showResultsBtn'),
      results: document.getElementById('results'),
      finalScore: document.getElementById('finalScore'),
      scoreMessage: document.getElementById('scoreMessage'),
      categoryBreakdown: document.getElementById('categoryBreakdown'),
      restartBtn: document.getElementById('restartBtn')
    };

    function init() {
      renderQuestion();
      updateProgress();
    }

    function renderQuestion() {
      const q = questions[currentQuestion];
      
      elements.questionNumber.textContent = `Q${currentQuestion + 1}`;
      elements.questionTitle.textContent = q.title;
      elements.questionContext.textContent = q.context;
      
      elements.options.innerHTML = '';
      q.options.forEach((option, index) => {
        const div = document.createElement('div');
        div.className = 'option';
        div.innerHTML = `
          <div class="option-letter">${String.fromCharCode(65 + index)}</div>
          <div class="option-content">${option}</div>
        `;
        div.addEventListener('click', () => selectOption(index));
        elements.options.appendChild(div);
      });

      elements.feedback.className = 'feedback';
      elements.feedback.style.display = 'none';

      const answered = answers[currentQuestion] !== null;
      if (answered) {
        showAnswerState(answers[currentQuestion]);
      }

      updateButtons();
    }

    function selectOption(index) {
      if (quizCompleted || answers[currentQuestion] !== null) return;

      answers[currentQuestion] = index;
      
      if (index === questions[currentQuestion].correct) {
        score++;
      }
      
      showAnswerState(index);
      updateProgress();
      updateButtons();
    }

    function showAnswerState(selectedIndex) {
      const q = questions[currentQuestion];
      const options = elements.options.children;
      
      for (let i = 0; i < options.length; i++) {
        options[i].classList.remove('selected', 'correct', 'incorrect');
        
        if (i === selectedIndex) {
          options[i].classList.add('selected');
          if (i === q.correct) {
            options[i].classList.add('correct');
            showFeedback('success', `✅ Bonne réponse ! ${q.feedback}`);
          } else {
            options[i].classList.add('incorrect');
            showFeedback('error', `❌ Faux. ${q.feedback}`);
            options[q.correct].classList.add('correct');
          }
        }
      }
    }

    function showFeedback(type, text) {
      elements.feedback.textContent = text;
      elements.feedback.className = `feedback ${type}`;
      elements.feedback.style.display = 'block';
    }

    function updateProgress() {
      const progress = ((currentQuestion + 1) / questions.length) * 100;
      elements.progressFill.style.width = `${progress}%`;
      elements.progressText.textContent = `Question ${currentQuestion + 1} / ${questions.length}`;
      elements.scoreText.textContent = `${score} / ${questions.length}`;
    }

    function updateButtons() {
      const answered = answers[currentQuestion] !== null;
      const isFirst = currentQuestion === 0;
      const isLast = currentQuestion === questions.length - 1;
      
      elements.prevBtn.disabled = isFirst && !quizCompleted;
      elements.nextBtn.disabled = !answered || isLast;
      elements.showResultsBtn.style.display = quizCompleted ? 'none' : 
        (isLast && answered) ? 'inline-flex' : 'none';
    }

    function nextQuestion() {
      if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        renderQuestion();
      }
    }

    function prevQuestion() {
      if (currentQuestion > 0) {
        currentQuestion--;
        renderQuestion();
      }
    }

    function showResults() {
      quizCompleted = true;
      elements.results.classList.add('show');
      
      const percentage = Math.round((score / questions.length) * 100);
      elements.finalScore.textContent = `${score}/${questions.length} (${percentage}%)`;
      
      let message = '';
      if (percentage >= 90) message = '🇫🇷 Excellent ! Maîtrise parfaite de l\'actualité.';
      else if (percentage >= 75) message = '👍 Très bonne connaissance des événements majeurs.';
      else if (percentage >= 60) message = '📚 Bonne base, quelques révisions utiles.';
      else message = '🔄 Occasion d\'approfondir l\'actualité internationale.';
      
      elements.scoreMessage.textContent = message;
      
      // Category breakdown
      const categories = {};
      questions.forEach((q, i) => {
        categories[q.category] = categories[q.category] || { correct: 0, total: 0 };
        categories[q.category].total++;
        if (answers[i] === q.correct) categories[q.category].correct++;
      });
      
      elements.categoryBreakdown.innerHTML = Object.entries(categories).map(([cat, data]) => {
        const catNames = {
          geopolitics: 'Géopolitique',
          politics: 'Politique',
          economy: 'Économie',
          calendar: 'Calendrier'
        };
        return `
          <div class="category">
            <div>${catNames[cat]}</div>
            <div class="category-score">${data.correct}/${data.total}</div>
          </div>
        `;
      }).join('');
    }

    function restart() {
      currentQuestion = 0;
      score = 0;
      answers = new Array(questions.length).fill(null);
      quizCompleted = false;
      elements.results.classList.remove('show');
      renderQuestion();
    }

    // Event listeners
    elements.prevBtn.addEventListener('click', prevQuestion);
    elements.nextBtn.addEventListener('click', nextQuestion);
    elements.showResultsBtn.addEventListener('click', showResults);
    elements.restartBtn.addEventListener('click', restart);

    init();
  </script>
</body>
</html>
