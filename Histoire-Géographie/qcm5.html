<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>QCM - Actualité française décembre 2025</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --primary: #1e40af;
      --success: #166534;
      --danger: #dc2626;
      --warning: #ea580c;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, var(--bg), #e0e7ff);
      color: var(--text);
      min-height: 100vh;
      padding: 1rem;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
    }

    .header {
      background: var(--card);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.1);
      margin-bottom: 2rem;
    }

    .flag {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 2rem;
      background: linear-gradient(135deg, var(--primary), #3b82f6);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1.15rem;
      margin-bottom: 1.5rem;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .info-card {
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      padding: 1rem;
      border-radius: 12px;
      text-align: center;
    }

    .info-number {
      font-size: 1.8rem;
      font-weight: bold;
      color: #b45309;
    }

    .quiz-main {
      background: var(--card);
      border-radius: 20px;
      padding: 2.5rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.1);
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 3px solid var(--border);
    }

    .progress-text {
      font-weight: 600;
      min-width: 140px;
    }

    .bar-container {
      flex: 1;
      height: 10px;
      background: var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #60a5fa);
      transition: width 0.4s ease;
      border-radius: 10px;
    }

    .score-current {
      font-weight: 600;
      color: var(--primary);
      min-width: 100px;
      text-align: right;
    }

    .question-section {
      margin-bottom: 2.5rem;
    }

    .q-number {
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 0.75rem;
      letter-spacing: 0.5px;
    }

    .q-title {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 1rem;
      line-height: 1.5;
    }

    .q-context {
      background: #f1f5f9;
      padding: 1.25rem;
      border-radius: 12px;
      border-left: 5px solid var(--primary);
      margin-bottom: 1.75rem;
      font-style: italic;
      color: var(--muted);
    }

    .options-grid {
      display: grid;
      gap: 1.25rem;
    }

    .option-btn {
      padding: 1.5rem 1.25rem;
      border: 2px solid var(--border);
      border-radius: 16px;
      background: white;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      font-size: 1rem;
      display: flex;
      align-items: flex-start;
      gap: 1rem;
    }

    .option-btn:hover:not(.answered) {
      border-color: var(--primary);
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(30, 64, 175, 0.15);
    }

    .option-letter {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .option-btn.answered {
      cursor: default;
    }

    .option-btn.correct {
      border-color: var(--success);
      background: #ecfdf5;
      box-shadow: 0 10px 30px rgba(22, 101, 52, 0.2);
    }

    .option-btn.correct .option-letter {
      background: var(--success);
    }

    .option-btn.incorrect {
      border-color: var(--danger);
      background: #fef2f2;
      opacity: 0.8;
    }

    .option-btn.selected {
      border-color: var(--primary);
      background: #eff6ff;
      box-shadow: 0 10px 30px rgba(30, 64, 175, 0.2);
    }

    .feedback-box {
      margin-top: 2rem;
      padding: 1.75rem;
      border-radius: 16px;
      font-weight: 500;
      transform: scale(0);
      transition: all 0.3s ease;
    }

    .feedback-box.show {
      transform: scale(1);
    }

    .feedback-success {
      background: linear-gradient(135deg, #d1fae5, #a7f3d0);
      border: 2px solid var(--success);
      color: var(--success);
    }

    .feedback-error {
      background: linear-gradient(135deg, #fee2e2, #fecaca);
      border: 2px solid var(--danger);
      color: var(--danger);
    }

    .nav-buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 3px solid var(--border);
      gap: 1rem;
    }

    .btn {
      padding: 1rem 2rem;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #3b82f6);
      color: white;
      box-shadow: 0 8px 25px rgba(30, 64, 175, 0.3);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(30, 64, 175, 0.4);
    }

    .btn-secondary {
      background: #f8fafc;
      color: var(--text);
      border: 2px solid var(--border);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    .results-section {
      display: none;
      text-align: center;
      margin-top: 3rem;
    }

    .results-section.show {
      display: block;
    }

    .final-score {
      font-size: 4rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--success), #22c55e);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 1rem 0 1.5rem;
    }

    .message {
      font-size: 1.3rem;
      margin-bottom: 2.5rem;
      padding: 2rem;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .restart-btn {
      max-width: 350px;
      width: 100%;
      margin-top: 2rem;
    }

    @media (max-width: 768px) {
      .nav-buttons {
        flex-direction: column-reverse;
        gap: 1.5rem;
      }
      
      .btn {
        justify-content: center;
      }
      
      .final-score {
        font-size: 3rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="flag">🇫🇷</div>
      <h1>Actualité française</h1>
      <p class="subtitle">QCM Décembre 2025 - 10 événements majeurs</p>
      <div class="info-grid">
        <div class="info-card">
          <div class="info-number">10</div>
          <div>Questions</div>
        </div>
        <div class="info-card">
          <div class="info-number">🚨</div>
          <div>Crise budgétaire</div>
        </div>
        <div class="info-card">
          <div class="info-number">📉</div>
          <div>Ralentissement économique</div>
        </div>
        <div class="info-card">
          <div class="info-number">⚡</div>
          <div>Politique tendue</div>
        </div>
      </div>
    </header>

    <main class="quiz-main">
      <div class="progress-row">
        <div class="progress-text" id="progressLabel">Q1 / 10</div>
        <div class="bar-container">
          <div class="bar-fill" id="progressBar"></div>
        </div>
        <div class="score-current" id="currentScore">0 / 10</div>
      </div>

      <section class="question-section">
        <div class="q-number" id="qNumber"></div>
        <h2 class="q-title" id="qTitle"></h2>
        <div class="q-context" id="qContext"></div>
        <div class="options-grid" id="optionsGrid"></div>
        <div class="feedback-box" id="feedbackBox"></div>
      </section>

      <div class="nav-buttons">
        <button class="btn btn-secondary" id="prevButton">← Précédent</button>
        <div>
          <button class="btn btn-secondary" id="nextButton">Suivant →</button>
          <button class="btn btn-primary" id="resultsButton" style="display: none;">Voir les résultats finaux</button>
        </div>
      </div>

      <section class="results-section" id="resultsSection">
        <div class="final-score" id="finalScore"></div>
        <div class="message" id="finalMessage"></div>
        <button class="btn btn-primary restart-btn" id="restartButton">
          🔄 Refaire le QCM
        </button>
      </section>
    </main>
  </div>

  <script>
    const questions = [
      {
        title: "Quel Premier ministre fait face à un vote crucial sur le budget de la Sécu en décembre 2025 ?",
        context: "Crise politique majeure à l'Assemblée nationale",
        options: ["Sébastien Lecornu", "Michel Barnier", "Élisabeth Borne", "Gabriel Attal"],
        correct: 0,
        explanation: "Sébastien Lecornu engage la responsabilité du gouvernement sur le PLFSS 2026, sans majorité parlementaire.",
        category: "politique"
      },
      {
        title: "Quel PMI flash montre un ralentissement quasi à l'arrêt du secteur privé français ?",
        context: "Indicateur économique S&P Global de décembre",
        options: ["50.1", "52.3", "48.7", "55.2"],
        correct: 0,
        explanation: "L'incertitude politique freine l'économie, deuxième de la zone euro.",
        category: "economie"
      },
      {
        title: "Selon l'OFCE, quelle est la prévision de croissance française pour 2025 ?",
        context: "Point de conjoncture décembre 2025",
        options: ["1.6%", "0.8%", "2.1%", "1.2%"],
        correct: 1,
        explanation: "Pire performance depuis 2013 hors crise sanitaire, à cause des efforts budgétaires.",
        category: "economie"
      },
      {
        title: "Quel déficit public atteint la France selon Moody's en 2025 ?",
        context: "Spirale budgétaire inquiétante",
        options: ["6.3% du PIB", "5.1% du PIB", "7.2% du PIB", "4.8% du PIB"],
        correct: 0,
        explanation: "Avec une dette à 115% du PIB, objectif <3% repoussé à 2029.",
        category: "budget"
      },
      {
        title: "Quel secteur dope l'activité économique malgré le ralentissement général ?",
        context: "Flash PMI décembre 2025",
        options: ["Industrie de la défense", "Aéronautique civile", "Automobile", "Tourisme"],
        correct: 0,
        explanation: "L'industrie de défense compense la croissance faible de 0.2% au T4.",
        category: "economie"
      },
      {
        title: "Quelle banque anticipe 0.7% de croissance en 2026 à cause des coupes budgétaires ?",
        context: "Analyse des efforts d'austérité",
        options: ["OFCE", "Banque de France", "BNP Paribas", "Société Générale"],
        correct: 0,
        explanation: "Les efforts budgétaires amputent la croissance de 0.8 point.",
        category: "economie"
      },
      {
        title: "Quel sommet franco-britannique a lieu en décembre sur le nucléaire ?",
        context: "Coopération bilatérale Élysée",
        options: ["Groupe de pilotage nucléaire", "Sommet énergie UE", "Forum atlantique", "Conseil franco-UK"],
        correct: 0,
        explanation: "Premier rencontre du New UK-France Nuclear Steering Group à Paris.",
        category: "international"
      },
      {
        title: "Quelle déclaration commune signe la France avec la Chine en décembre ?",
        context: "Élysée - gouvernance mondiale",
        options: ["Amélioration gouvernance globale", "Commerce bilatéral", "Investissements verts", "Sécurité Asie-Pacifique"],
        correct: 0,
        explanation: "Joint Statement entre France et RPC sur la gouvernance globale.",
        category: "international"
      },
      {
        title: "Quel niveau de dette publique projette-t-on pour 2028 en France ?",
        context: "Trajectoire budgétaire alarmante",
        options: ["121%", "118%", "125%", "115%"],
        correct: 0,
        explanation: "Dette estimée à 121% du PIB selon les projections actuelles.",
        category: "budget"
      },
      {
        title: "Quelle mesure budgétaire prépare le gouvernement pour 2026 ?",
        context: "Réponse à la crise des finances publiques",
        options: ["Diminution massive dépenses sociales", "Hausse impôts riches", "Privatisation services publics", "Augmentation TVA"],
        correct: 0,
        explanation: "Préparation à des coupes historiques dans les dépenses sociales pour l'équilibre budgétaire.",
        category: "budget"
      }
    ];

    let currentQ = 0;
    let score = 0;
    let userAnswers = new Array(questions.length).fill(null);
    let completed = false;

    const els = {
      progressLabel: document.getElementById('progressLabel'),
      progressBar: document.getElementById('progressBar'),
      currentScore: document.getElementById('currentScore'),
      qNumber: document.getElementById('qNumber'),
      qTitle: document.getElementById('qTitle'),
      qContext: document.getElementById('qContext'),
      optionsGrid: document.getElementById('optionsGrid'),
      feedbackBox: document.getElementById('feedbackBox'),
      prevButton: document.getElementById('prevButton'),
      nextButton: document.getElementById('nextButton'),
      resultsButton: document.getElementById('resultsButton'),
      resultsSection: document.getElementById('resultsSection'),
      finalScore: document.getElementById('finalScore'),
      finalMessage: document.getElementById('finalMessage'),
      restartButton: document.getElementById('restartButton')
    };

    function renderQuestion() {
      const q = questions[currentQ];
      els.qNumber.textContent = `Question ${currentQ + 1}`;
      els.qTitle.textContent = q.title;
      els.qContext.textContent = q.context;
      
      els.optionsGrid.innerHTML = '';
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `
          <div class="option-letter">${String.fromCharCode(65 + idx)}</div>
          <div>${opt}</div>
        `;
        btn.onclick = () => chooseAnswer(idx);
        els.optionsGrid.appendChild(btn);
      });
      
      els.feedbackBox.classList.remove('show', 'feedback-success', 'feedback-error');
      
      if (userAnswers[currentQ] !== null) {
        showAnswerFeedback(userAnswers[currentQ]);
      }
      
      updateNav();
      updateProgress();
    }

    function chooseAnswer(idx) {
      if (completed || userAnswers[currentQ] !== null) return;
      
      userAnswers[currentQ] = idx;
      const isCorrect = idx === questions[currentQ].correct;
      if (isCorrect) score++;
      
      showAnswerFeedback(idx);
      updateProgress();
      updateNav();
    }

    function showAnswerFeedback(selectedIdx) {
      const q = questions[currentQ];
      const buttons = els.optionsGrid.children;
      
      Array.from(buttons).forEach((btn, i) => {
        btn.classList.remove('selected', 'correct', 'incorrect');
        if (i === selectedIdx) {
          btn.classList.add('selected');
          if (i === q.correct) {
            btn.classList.add('correct');
            showFeedback(true);
          } else {
            btn.classList.add('incorrect');
            buttons[q.correct].classList.add('correct');
            showFeedback(false);
          }
        }
        btn.classList.add('answered');
      });
    }

    function showFeedback(isCorrect) {
      const q = questions[currentQ];
      els.feedbackBox.textContent = isCorrect 
        ? `✅ Excellente mémoire ! ${q.explanation}`
        : `❌ À revoir : ${q.explanation}`;
      els.feedbackBox.className = `feedback-box show ${isCorrect ? 'feedback-success' : 'feedback-error'}`;
    }

    function updateProgress() {
      const pct = ((currentQ + 1) / questions.length) * 100;
      els.progressBar.style.width = `${pct}%`;
      els.progressLabel.textContent = `Q${currentQ + 1} / 10`;
      els.currentScore.textContent = `${score} / 10`;
    }

    function updateNav() {
      const answered = userAnswers[currentQ] !== null;
      const isFirst = currentQ === 0;
      const isLast = currentQ === questions.length - 1;
      
      els.prevButton.disabled = isFirst;
      els.nextButton.disabled = !answered || isLast;
      els.resultsButton.style.display = (answered && isLast) ? 'flex' : 'none';
    }

    function nextQ() {
      if (currentQ < questions.length - 1) {
        currentQ++;
        renderQuestion();
      }
    }

    function prevQ() {
      if (currentQ > 0) {
        currentQ--;
        renderQuestion();
      }
    }

    function showFinalResults() {
      completed = true;
      const pct = Math.round((score / 10) * 100);
      els.finalScore.textContent = `${score}/10 (${pct}%)`;
      
      let msg = '';
      if (pct >= 90) msg = '🇫🇷 Expert de l\'actualité française ! Impressionnant.';
      else if (pct >= 80) msg = '📱 Excellente veille ! Vous suivez de près.';
      else if (pct >= 60) msg = '👀 Bonne connaissance, approfondissez la crise budgétaire.';
      else msg = '🔄 Revoir les chiffres économiques et le contexte politique.';
      
      els.finalMessage.innerHTML = msg;
      els.resultsSection.classList.add('show');
    }

    function restartQuiz() {
      currentQ = 0;
      score = 0;
      userAnswers = new Array(10).fill(null);
      completed = false;
      els.resultsSection.classList.remove('show');
      renderQuestion();
    }

    // Événements
    els.prevButton.onclick = prevQ;
    els.nextButton.onclick = nextQ;
    els.resultsButton.onclick = showFinalResults;
    els.restartButton.onclick = restartQuiz;

    renderQuestion();
  </script>
</body>
</html>
