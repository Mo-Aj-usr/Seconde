<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>QCM - Méditerranée médiévale</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --primary: #1d4ed8;
      --primary-light: #dbeafe;
      --danger: #b91c1c;
      --success: #15803d;
      --bg: #f3f4f6;
      --text: #111827;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .quiz-wrapper {
      width: 100%;
      max-width: 800px;
    }

    .quiz-card {
      background: #ffffff;
      border-radius: var(--radius);
      padding: 20px 20px 24px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
    }

    h1 {
      font-size: 1.4rem;
      margin: 0 0 4px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #6b7280;
      margin-bottom: 16px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
      color: #6b7280;
      margin-bottom: 12px;
    }

    .chip {
      padding: 4px 10px;
      border-radius: 999px;
      background: #eef2ff;
      color: #4338ca;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .chip small {
      font-size: 0.8rem;
    }

    .progress-container {
      margin: 12px 0 16px;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: #e5e7eb;
      overflow: hidden;
    }

    .progress-bar-inner {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4f46e5, #0ea5e9);
      transition: width 0.25s ease;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: #6b7280;
      margin-top: 4px;
    }

    .question-header {
      margin-top: 8px;
      margin-bottom: 12px;
    }

    .question-number {
      font-size: 0.85rem;
      text-transform: uppercase;
      color: #6b7280;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .question-text {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .question-context {
      font-size: 0.86rem;
      color: #6b7280;
    }

    .choices {
      display: grid;
      gap: 8px;
      margin-top: 14px;
    }

    .choice {
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      padding: 10px 12px;
      cursor: pointer;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      transition: background 0.2s ease, border-color 0.2s ease,
        transform 0.05s ease;
      text-align: left;
    }

    .choice:hover {
      background: #eff6ff;
      border-color: #bfdbfe;
      transform: translateY(-1px);
    }

    .choice.disabled {
      cursor: default;
      opacity: 0.9;
      transform: none;
    }

    .choice-indicator {
      width: 22px;
      height: 22px;
      min-width: 22px;
      border-radius: 999px;
      border: 2px solid #cbd5f5;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: #6b7280;
      background: #eef2ff;
    }

    .choice-text {
      font-size: 0.9rem;
    }

    .choice.correct {
      border-color: #bbf7d0;
      background: #ecfdf5;
    }

    .choice.correct .choice-indicator {
      border-color: #4ade80;
      background: #22c55e;
      color: #ffffff;
    }

    .choice.incorrect {
      border-color: #fecaca;
      background: #fef2f2;
    }

    .choice.incorrect .choice-indicator {
      border-color: #fca5a5;
      background: #ef4444;
      color: #ffffff;
    }

    .feedback {
      margin-top: 10px;
      font-size: 0.88rem;
      min-height: 1.2em;
    }

    .feedback.correct {
      color: var(--success);
    }

    .feedback.incorrect {
      color: var(--danger);
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-left,
    .nav-right {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #e5e7eb;
      color: #111827;
      transition: background 0.2s ease, transform 0.05s ease,
        box-shadow 0.1s ease;
    }

    button span.icon {
      font-size: 1rem;
    }

    button:hover:not(:disabled) {
      background: #d1d5db;
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(148, 163, 184, 0.3);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
      box-shadow: none;
      transform: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #2563eb);
      color: #ffffff;
      box-shadow: 0 12px 25px rgba(37, 99, 235, 0.35);
    }

    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #4338ca, #1d4ed8);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid #d1d5db;
    }

    .status-pill {
      padding: 4px 8px;
      border-radius: 999px;
      background: #f3f4f6;
      font-size: 0.78rem;
      color: #4b5563;
    }

    .result-panel {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #e5e7eb;
      font-size: 0.9rem;
    }

    .result-score {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .result-detail {
      font-size: 0.86rem;
      color: #6b7280;
    }

    .pill-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .pill {
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.76rem;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      color: #4b5563;
    }

    @media (max-width: 600px) {
      .quiz-card {
        padding: 16px 14px 18px;
      }
      h1 {
        font-size: 1.2rem;
      }
      .nav {
        flex-direction: column;
        align-items: stretch;
      }
      .nav-left,
      .nav-right {
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>
  <main class="quiz-wrapper" aria-label="QCM Méditerranée médiévale">
    <section class="quiz-card">
      <header>
        <h1>Méditerranée médiévale : échanges et conflits</h1>
        <p class="subtitle">
          QCM de 15 questions – Niveau Seconde – Chapitre 2 : Un espace d’échanges et de conflits.
        </p>
        <div class="meta">
          <div class="chip">
            <span>💡</span>
            <small>Réponse immédiate et score en direct</small>
          </div>
          <div class="chip">
            <span>📱</span>
            <small>Interface adaptée aux mobiles</small>
          </div>
        </div>
      </header>

      <div class="progress-container" aria-hidden="true">
        <div class="progress-bar">
          <div class="progress-bar-inner" id="progressBar"></div>
        </div>
        <div class="progress-text">
          <span id="progressLabel">Question 1 / 15</span>
          <span id="scoreLabel">Score : 0 / 15</span>
        </div>
      </div>

      <article>
        <div class="question-header">
          <div class="question-number" id="questionNumber"></div>
          <div class="question-text" id="questionText"></div>
          <div class="question-context" id="questionContext"></div>
        </div>

        <div class="choices" id="choicesContainer" role="listbox" aria-label="Réponses possibles"></div>

        <p class="feedback" id="feedback" aria-live="polite"></p>
      </article>

      <div class="nav">
        <div class="nav-left">
          <button type="button" id="prevBtn" class="btn-outline">
            <span class="icon">←</span>
            Question précédente
          </button>
          <button type="button" id="nextBtn" class="btn-outline">
            Question suivante
            <span class="icon">→</span>
          </button>
        </div>
        <div class="nav-right">
          <button type="button" id="restartBtn">
            Recommencer
          </button>
          <button type="button" id="submitBtn" class="btn-primary">
            Voir le résultat final
          </button>
        </div>
      </div>

      <section class="result-panel" aria-live="polite">
        <div class="result-score" id="resultScore"></div>
        <div class="result-detail" id="resultDetail"></div>
        <div class="pill-list" id="resultTags"></div>
      </section>
    </section>
  </main>

  <script>
    const questions = [
      {
        question:
          "Entre le VIIᵉ et le XIIIᵉ siècle, la Méditerranée est avant tout…",
        context:
          "On cherche ici à caractériser la fonction de la Méditerranée dans le monde médiéval.",
        choices: [
          "Une frontière étanche entre trois mondes hostiles",
          "Un carrefour d’échanges et de contacts entre trois civilisations",
          "Un espace marginal, dominé par l’Atlantique",
          "Une mer contrôlée exclusivement par la Chrétienté latine",
        ],
        correctIndex: 1,
        feedback:
          "La Méditerranée est un **carrefour** où se rencontrent monde latin, byzantin et musulman, mêlant échanges et conflits.",
      },
      {
        question:
          "Quelle affirmation résume le mieux les divisions internes du monde musulman médiéval ?",
        context:
          "On s’intéresse ici à la différence entre unité religieuse et réalités politiques.",
        choices: [
          "Unité politique parfaite autour d’un seul calife",
          "Unité religieuse relative, mais fractures politiques et dynastiques",
          "Division religieuse totale entre plusieurs religions",
          "Absence de conflits internes avant le XIIIᵉ siècle",
        ],
        correctIndex: 1,
        feedback:
          "Le monde musulman partage l’islam, mais se divise entre dynasties (Omeyyades, Abbassides, Fatimides) et courants (sunnites, chiites).",
      },
      {
        question:
          "Quel événement consacre la rupture entre Église catholique et Église orthodoxe ?",
        context: "Il s’agit d’un repère religieux majeur pour la Chrétienté.",
        choices: [
          "La crise iconoclaste (726‑843)",
          "La première croisade (1095)",
          "Le schisme de 1054",
          "La chute de Constantinople (1453)",
        ],
        correctIndex: 2,
        feedback:
          "Le schisme de 1054 marque l’excommunication mutuelle entre Rome et Constantinople et divise durablement la Chrétienté.",
      },
      {
        question:
          "Quel mouvement hérétique illustre les tensions internes de l’Occident chrétien au XIIᵉ siècle ?",
        context: "On parle ici d’un mouvement surtout présent dans le Languedoc.",
        choices: [
          "Les iconodules",
          "Les cathares (ou albigeois)",
          "Les sunnites",
          "Les chiites",
        ],
        correctIndex: 1,
        feedback:
          "Les cathares contestent l’Église catholique et sont réprimés par la croisade albigeoise et l’Inquisition.",
      },
      {
        question:
          "Quel espace est fortement touché par la croisade albigeoise (1209‑1229) ?",
        context:
          "On cherche à localiser un des grands foyers de tensions religieuses internes.",
        choices: [
          "La Sicile normande",
          "Le Languedoc, dans le sud de la France",
          "La péninsule Ibérique",
          "L’Italie du Nord",
        ],
        correctIndex: 1,
        feedback:
          "Le Languedoc est ravagé par la croisade albigeoise, visant à éradiquer l’hérésie cathare.",
      },
      {
        question:
          "Quel événement déclenche l’appel à la première croisade par Urbain II en 1095 ?",
        context: "La question porte sur les tensions autour de Jérusalem.",
        choices: [
          "La prise de Constantinople par les croisés",
          "La destruction du Saint‑Sépulcre et la victoire seldjoukide à Manzikert",
          "La fin du schisme de 1054",
          "La conquête de la Sicile par les Normands",
        ],
        correctIndex: 1,
        feedback:
          "La destruction du Saint‑Sépulcre et les défaites byzantines encouragent Urbain II à appeler à la croisade pour libérer les Lieux saints.",
      },
      {
        question:
          "Quel est le principal résultat de la première croisade (1095‑1099) ?",
        context: "Il s’agit d’un repère politique et religieux en Orient.",
        choices: [
          "La prise de Jérusalem et la création des États latins d’Orient",
          "La reconquête de l’Égypte sur les Fatimides",
          "La prise de Constantinople par les croisés",
          "L’union des Églises catholique et orthodoxe",
        ],
        correctIndex: 0,
        feedback:
          "La première croisade aboutit à la prise de Jérusalem et à la fondation des États latins d’Orient (royaume de Jérusalem, comté d’Antioche…).",
      },
      {
        question:
          "Quel rôle joue Saladin dans l’histoire des croisades ?",
        context:
          "On s’intéresse ici à une grande figure du monde musulman médiéval.",
        choices: [
          "Il prêche la deuxième croisade",
          "Il conduit la quatrième croisade contre Constantinople",
          "Il reprend Jérusalem en 1187 tout en négociant des pèlerinages chrétiens",
          "Il fonde la Maison de la Sagesse à Bagdad",
        ],
        correctIndex: 2,
        feedback:
          "Saladin, sultan ayyoubide, bat les croisés à Hattin et reprend Jérusalem, tout en maintenant l’accès des pèlerins chrétiens.",
      },
      {
        question:
          "Pourquoi la quatrième croisade (1202‑1204) est‑elle un tournant dramatique pour la Méditerranée chrétienne ?",
        context: "Il s’agit d’une dérive de croisade souvent soulignée par les historiens.",
        choices: [
          "Elle échoue à prendre Jérusalem",
          "Elle détruit définitivement les États latins d’Orient",
          "Elle se détourne vers Constantinople et pille la capitale byzantine",
          "Elle marque la fin des croisades",
        ],
        correctIndex: 2,
        feedback:
          "Détournée par Venise, la quatrième croisade aboutit au sac de Constantinople, aggravant le fossé entre catholiques et orthodoxes.",
      },
      {
        question:
          "Quel rôle joue Venise dans les échanges méditerranéens du Moyen Âge ?",
        context: "On s’intéresse à une puissance commerciale majeure.",
        choices: [
          "Une petite cité sans influence maritime",
          "Une république marchande contrôlant des routes et des comptoirs",
          "Un empire territorial centré sur l’agriculture",
          "Une simple dépendance de l’Empire byzantin",
        ],
        correctIndex: 1,
        feedback:
          "Venise est une république marchande puissante, profitant des croisades pour obtenir des comptoirs et structurer les échanges.",
      },
      {
        question:
          "Pourquoi al‑Andalus est‑elle souvent présentée comme un « laboratoire culturel » ?",
        context:
          "On parle ici d’un espace où se croisent plusieurs traditions intellectuelles.",
        choices: [
          "Parce qu’elle est fermée aux influences extérieures",
          "Parce que juifs, chrétiens et musulmans y traduisent et débattent des œuvres antiques",
          "Parce qu’elle est uniquement chrétienne",
          "Parce qu’elle ne commerce pas avec l’Afrique et l’Orient",
        ],
        correctIndex: 1,
        feedback:
          "En al‑Andalus, des savants de différentes religions traduisent Aristote et d’autres œuvres, ce qui diffuse ces savoirs en Europe.",
      },
      {
        question:
          "Quelle caractéristique majeure de la Sicile normande sous Roger II (XIIᵉ siècle) met en lumière la notion de métissage culturel ?",
        context: "On s’intéresse à un royaume où coexistent plusieurs religions.",
        choices: [
          "L’expulsion systématique des minorités religieuses",
          "L’architecture arabo‑normande mêlant influences arabes, byzantines et latines",
          "La destruction des monuments musulmans",
          "L’interdiction du commerce avec le monde musulman",
        ],
        correctIndex: 1,
        feedback:
          "La Sicile normande se caractérise par une architecture arabo‑normande et une coexistence de musulmans, catholiques et orthodoxes.",
      },
      {
        question:
          "Que désigne l’expression « gens du Livre » dans le monde musulman médiéval ?",
        context: "On se place ici dans le vocabulaire religieux et juridique de l’islam.",
        choices: [
          "Uniquement les musulmans",
          "Les adeptes du polythéisme",
          "Les juifs, les chrétiens et les musulmans partageant des textes révélés",
          "Les seuls chrétiens d’Orient",
        ],
        correctIndex: 2,
        feedback:
          "Les « gens du Livre » regroupent juifs, chrétiens et musulmans, ce qui justifie un statut particulier (dhimmi) pour les minorités.",
      },
      {
        question:
          "Quel type de produits circule sur les routes commerciales méditerranéennes médiévales ?",
        context: "On vise ici la variété des échanges économiques.",
        choices: [
          "Uniquement des produits agricoles européens",
          "Principalement des esclaves nord‑européens",
          "Épices, soieries, métaux, esclaves, textiles et produits agricoles",
          "Uniquement de l’or africain",
        ],
        correctIndex: 2,
        feedback:
          "Les routes relient Europe, Afrique et Asie, et véhiculent des épices, soieries, or, esclaves, métaux, textiles et produits agricoles.",
      },
      {
        question:
          "Quel est l’un des principaux effets des échanges culturels entre monde musulman, byzantin et latin ?",
        context: "On pense ici aux conséquences intellectuelles à long terme.",
        choices: [
          "La disparition des textes de l’Antiquité",
          "La diffusion en Occident d’Aristote, des mathématiques arabes et de la médecine antique",
          "La fermeture des universités européennes",
          "La fin des conflits religieux",
        ],
        correctIndex: 1,
        feedback:
          "Les traductions (Tolède, Palerme) permettent la redécouverte d’Aristote, de l’algèbre et de la médecine antique, alimentant la scolastique.",
      },
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    const userAnswers = new Array(questions.length).fill(null);

    const questionNumberEl = document.getElementById("questionNumber");
    const questionTextEl = document.getElementById("questionText");
    const questionContextEl = document.getElementById("questionContext");
    const choicesContainerEl = document.getElementById("choicesContainer");
    const feedbackEl = document.getElementById("feedback");
    const progressBarEl = document.getElementById("progressBar");
    const progressLabelEl = document.getElementById("progressLabel");
    const scoreLabelEl = document.getElementById("scoreLabel");
    const resultScoreEl = document.getElementById("resultScore");
    const resultDetailEl = document.getElementById("resultDetail");
    const resultTagsEl = document.getElementById("resultTags");

    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const submitBtn = document.getElementById("submitBtn");
    const restartBtn = document.getElementById("restartBtn");

    function updateProgressUI() {
      const total = questions.length;
      const current = currentQuestionIndex + 1;
      const percent = (current / total) * 100;
      progressBarEl.style.width = percent + "%";
      progressLabelEl.textContent = `Question ${current} / ${total}`;
      scoreLabelEl.textContent = `Score : ${score} / ${total}`;
    }

    function renderQuestion() {
      const q = questions[currentQuestionIndex];
      questionNumberEl.textContent = `Question ${currentQuestionIndex + 1}`;
      questionTextEl.textContent = q.question;
      questionContextEl.textContent = q.context;
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";

      choicesContainerEl.innerHTML = "";

      q.choices.forEach((choiceText, index) => {
        const choiceBtn = document.createElement("button");
        choiceBtn.type = "button";
        choiceBtn.className = "choice";
        choiceBtn.setAttribute("role", "option");
        choiceBtn.setAttribute("data-index", index);

        const indicator = document.createElement("span");
        indicator.className = "choice-indicator";
        indicator.textContent = String.fromCharCode(65 + index);

        const textSpan = document.createElement("span");
        textSpan.className = "choice-text";
        textSpan.textContent = choiceText;

        choiceBtn.appendChild(indicator);
        choiceBtn.appendChild(textSpan);

        choiceBtn.addEventListener("click", () => handleChoiceClick(index));

        choicesContainerEl.appendChild(choiceBtn);
      });

      // Si l'élève a déjà répondu à cette question, réafficher l’état
      if (userAnswers[currentQuestionIndex] !== null) {
        highlightAnswer(userAnswers[currentQuestionIndex], false);
      }

      prevBtn.disabled = currentQuestionIndex === 0;
      nextBtn.disabled = currentQuestionIndex === questions.length - 1;

      updateProgressUI();
    }

    function handleChoiceClick(selectedIndex) {
      const q = questions[currentQuestionIndex];

      const previousAnswer = userAnswers[currentQuestionIndex];
      const isFirstTime = previousAnswer === null;

      userAnswers[currentQuestionIndex] = selectedIndex;

      if (isFirstTime) {
        if (selectedIndex === q.correctIndex) {
          score++;
        }
      } else {
        // Si l’élève change sa réponse, ajuster le score
        if (previousAnswer === q.correctIndex && selectedIndex !== q.correctIndex) {
          score--;
        } else if (
          previousAnswer !== q.correctIndex &&
          selectedIndex === q.correctIndex
        ) {
          score++;
        }
      }

      highlightAnswer(selectedIndex, true);
      updateProgressUI();
    }

    function highlightAnswer(selectedIndex, showFeedback) {
      const q = questions[currentQuestionIndex];
      const choiceButtons = Array.from(
        choicesContainerEl.querySelectorAll(".choice")
      );

      choiceButtons.forEach((btn) => {
        btn.classList.remove("correct", "incorrect");
        btn.classList.remove("disabled");
      });

      choiceButtons[selectedIndex].classList.add(
        selectedIndex === q.correctIndex ? "correct" : "incorrect"
      );

      if (selectedIndex !== q.correctIndex) {
        choiceButtons[q.correctIndex].classList.add("correct");
      }

      choiceButtons.forEach((btn) => {
        btn.classList.add("disabled");
      });

      if (showFeedback) {
        if (selectedIndex === q.correctIndex) {
          feedbackEl.textContent = "Bonne réponse ! " + q.feedback;
          feedbackEl.className = "feedback correct";
        } else {
          feedbackEl.textContent = "Réponse incorrecte. " + q.feedback;
          feedbackEl.className = "feedback incorrect";
        }
      } else {
        feedbackEl.textContent = q.feedback || "";
        feedbackEl.className =
          selectedIndex === q.correctIndex
            ? "feedback correct"
            : "feedback incorrect";
      }
    }

    function showResults() {
      const total = questions.length;
      const percent = Math.round((score / total) * 100);

      resultScoreEl.textContent = `Résultat : ${score} / ${total} (${percent} %)`;

      let message = "";
      if (percent >= 85) {
        message =
          "Très bonne maîtrise du chapitre : les grandes dynamiques de la Méditerranée médiévale sont bien comprises.";
      } else if (percent >= 60) {
        message =
          "Maîtrise correcte : quelques points à revoir (chronologie des croisades, vocabulaire comme « gens du Livre » ou « États latins d’Orient »).";
      } else {
        message =
          "Résultat fragile : il est conseillé de relire le cours (cartes, frises) et le glossaire pour consolider les repères.";
      }

      resultDetailEl.textContent = message;

      const nbChronologie = [6, 7, 8].filter(
        (i) => userAnswers[i] === questions[i].correctIndex
      ).length;
      const nbCivilisations = [0, 1, 2, 3, 4, 12].filter(
        (i) => userAnswers[i] === questions[i].correctIndex
      ).length;
      const nbEchanges = [9, 10, 11, 13, 14].filter(
        (i) => userAnswers[i] === questions[i].correctIndex
      ).length;

      resultTagsEl.innerHTML = "";

      const mkTag = (label) => {
        const span = document.createElement("span");
        span.className = "pill";
        span.textContent = label;
        return span;
      };

      resultTagsEl.appendChild(
        mkTag(`Repères croisés : ${nbChronologie} / 3`)
      );
      resultTagsEl.appendChild(
        mkTag(`Civilisations & conflits : ${nbCivilisations} / 6`)
      );
      resultTagsEl.appendChild(
        mkTag(`Échanges & circulations : ${nbEchanges} / 5`)
      );
    }

    function goToPrevious() {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        renderQuestion();
      }
    }

    function goToNext() {
      if (currentQuestionIndex < questions.length - 1) {
        currentQuestionIndex++;
        renderQuestion();
      }
    }

    function restartQuiz() {
      currentQuestionIndex = 0;
      score = 0;
      for (let i = 0; i < userAnswers.length; i++) {
        userAnswers[i] = null;
      }
      resultScoreEl.textContent = "";
      resultDetailEl.textContent = "";
      resultTagsEl.innerHTML = "";
      renderQuestion();
    }

    prevBtn.addEventListener("click", goToPrevious);
    nextBtn.addEventListener("click", goToNext);
    submitBtn.addEventListener("click", showResults);
    restartBtn.addEventListener("click", restartQuiz);

    renderQuestion();
  </script>
</body>
</html>
