<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>QCM – Événements de décembre 2025</title>
<style>
    body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f4f6f8;
        margin: 0;
        padding: 20px;
    }
    .container {
        max-width: 900px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    h1 {
        text-align: center;
        color: #2c3e50;
    }
    .question {
        margin-bottom: 20px;
        padding: 15px;
        border-left: 5px solid #3498db;
        background: #ecf5ff;
        border-radius: 6px;
    }
    .question h3 {
        margin-top: 0;
    }
    label {
        display: block;
        margin: 6px 0;
        cursor: pointer;
    }
    button {
        display: block;
        margin: 30px auto;
        padding: 12px 25px;
        font-size: 16px;
        background: #3498db;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }
    button:hover {
        background: #2980b9;
    }
    .result {
        margin-top: 30px;
        padding: 20px;
        background: #fdfdfd;
        border-radius: 8px;
        border: 2px solid #2ecc71;
    }
    .correct { color: green; font-weight: bold; }
    .incorrect { color: red; font-weight: bold; }
</style>
</head>

<body>
<div class="container">
<h1>QCM – Événements internationaux<br>Décembre 2025</h1>

<form id="quiz">

<script>
const questions = [
 {q:"Quel pays a connu un coup d’État militaire en décembre 2025 ?",
  a:["Mali","Guinée-Bissau","Niger","Burkina Faso"], c:1,
  e:"La Guinée-Bissau a été dirigée par une junte ayant suspendu la Constitution."},

 {q:"Quelle ville de RDC a été prise par le mouvement M23 ?",
  a:["Goma","Bukavu","Uvira","Kisangani"], c:2,
  e:"Uvira, au Sud-Kivu, a été prise par le M23, aggravant les tensions régionales."},

 {q:"Quel acteur s’est emparé du gouvernorat d’al-Mahrah au Yémen ?",
  a:["Les Houthis","Al-Qaïda","Conseil de transition du Sud","Arabie saoudite"], c:2,
  e:"Le Conseil de transition du Sud a renforcé son contrôle territorial."},

 {q:"Où a eu lieu l’assassinat d’un général russe par voiture piégée ?",
  a:["Kiev","Moscou","Rostov","Donetsk"], c:1,
  e:"L’attentat a eu lieu à Moscou, suscitant de fortes tensions diplomatiques."},

 {q:"Dans quelle province iranienne des Gardiens de la révolution ont-ils été tués ?",
  a:["Khuzestan","Fars","Sistan-et-Baloutchistan","Kurdistan"], c:2,
  e:"Cette province est marquée par une insécurité chronique."},

 {q:"Quel Premier ministre a démissionné en Bulgarie ?",
  a:["Boyko Borissov","Kiril Petkov","Rosen Zhelyazkov","Rumen Radev"], c:2,
  e:"Il a quitté ses fonctions après des manifestations anticorruption."},

 {q:"Quel parti a gagné les élections à Saint-Lucie ?",
  a:["United Workers Party","Saint Lucia Labour Party","Green Party","National Alliance"], c:1,
  e:"Le parti de Philip J. Pierre conserve une large majorité."},

 {q:"Quel dirigeant est redevenu Premier ministre tchèque ?",
  a:["Petr Fiala","Andrej Babiš","Miloš Zeman","Vaclav Klaus"], c:1,
  e:"Andrej Babiš entame un second mandat non consécutif."},

 {q:"Dans quel pays les élections ont-elles été fortement contestées ?",
  a:["Pérou","Honduras","Colombie","Salvador"], c:1,
  e:"Des accusations de fraude ont entraîné de fortes tensions politiques."},

 {q:"Quel organisme a accordé 1,2 milliard $ au Pakistan ?",
  a:["Banque mondiale","FMI","OPEP","Banque asiatique"], c:1,
  e:"Le FMI soutient le Pakistan face à ses difficultés financières."},

 {q:"Quel pays a rejoint « Security Action for Europe » ?",
  a:["Norvège","Canada","Australie","Japon"], c:1,
  e:"Le Canada renforce sa coopération sécuritaire avec l’UE."},

 {q:"Quelle compagnie indienne a réduit ses vols de 5 % ?",
  a:["Air India","Vistara","IndiGo","SpiceJet"], c:2,
  e:"IndiGo a subi une crise organisationnelle majeure."},

 {q:"Quel événement monétaire a marqué décembre 2025 ?",
  a:["Création d’un euro numérique","Baisse des taux FED","Fin du dollar","Dévaluation du yuan"], c:1,
  e:"La Réserve fédérale américaine était attendue sur ses taux."},

 {q:"Quelle infrastructure a été inaugurée près de Mumbai ?",
  a:["Un port","Une autoroute","Un aéroport","Une zone franche"], c:2,
  e:"L’aéroport de Navi Mumbai vise à désengorger la métropole."},

 {q:"Quel événement sportif continental a débuté ?",
  a:["Coupe du monde","Coupe d’Asie","CAN 2025","Jeux Olympiques"], c:2,
  e:"La Coupe d’Afrique des Nations 2025 débute au Maroc."}
];

const quiz = document.getElementById("quiz");
questions.forEach((q, i) => {
    quiz.innerHTML += `
    <div class="question">
        <h3>${i+1}. ${q.q}</h3>
        ${q.a.map((opt,j)=>`
        <label>
            <input type="radio" name="q${i}" value="${j}">
            ${opt}
        </label>`).join("")}
    </div>`;
});
</script>

<button type="button" onclick="corriger()">Valider le QCM</button>
</form>

<div id="resultat"></div>

<script>
function corriger() {
    let score = 0;
    let html = "<div class='result'><h2>Résultats et corrections</h2>";

    questions.forEach((q,i)=>{
        const r = document.querySelector(`input[name="q${i}"]:checked`);
        if (r && parseInt(r.value) === q.c) {
            score++;
            html += `<p class="correct">✔ Question ${i+1} : Bonne réponse</p>`;
        } else {
            html += `<p class="incorrect">✘ Question ${i+1} : Mauvaise réponse<br>
            Réponse correcte : <strong>${q.a[q.c]}</strong><br>
            ${q.e}</p>`;
        }
    });

    html += `<h3>Score final : ${score} / 15</h3></div>`;
    document.getElementById("resultat").innerHTML = html;
}
</script>

</div>
</body>
</html>
